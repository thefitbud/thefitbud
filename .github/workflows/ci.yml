# CI on PRs to main and pushes to main.
# - ci (task H3): lint, typecheck and unit/API tests. Required by the "main" ruleset (H4);
#   the job id/name "ci" is stable.
# - e2e and banned-strings (W0): trainer-web Playwright against a locally seeded API
#   (db:reset + wrangler dev --local on the runner). Advisory until added to the ruleset.
# Stacked PRs whose base branch isn't main are not checked; they get CI once retargeted to main.
# No secrets, no deploys, no remote commands.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PRs share one group per number, so a newer push cancels the superseded run.
  # Pushes to main are grouped by commit SHA. A shared refs/heads/main group
  # still cancels a pending in-between run when a third push is queued, even
  # with cancel-in-progress false; only the in-progress run is kept.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which jobs a PR needs. Pushes to main always run everything.
  # code: anything outside docs/** and *.md. web: code that the trainer-web
  # e2e and banned-strings jobs exercise (not mobile-only or incoming seed data).
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Classify changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE...$HEAD")
          echo "$files"
          code=$(echo "$files" | grep -Ev '^docs/|\.md$' | grep -c . || true)
          web=$( { echo "$files" | grep -Ev '^docs/|\.md$|^apps/mobile/|^packages/ui-mobile/|^apps/api/seed/library/incoming/'; \
                   echo "$files" | grep -E '^docs/spec/banned-strings\.json$'; } | grep -c . || true)
          echo "code=$([ "$code" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "web=$([ "$web" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  ci:
    name: ci
    needs: changes
    # Required by the ruleset: a skipped job counts as passed, so docs-only PRs
    # merge without the 3-4 minute run. If classification fails, run anyway.
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node (.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # pnpm is cached explicitly below; setup-node's auto-cache is npm-only anyway.
          package-manager-cache: false

      # Corepack activates the pnpm version pinned in package.json "packageManager"
      # (pnpm@9.15.4), so only official actions/* actions are used.
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          pnpm --version

      - name: Locate pnpm store
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # setup:local (.dev.vars from .dev.vars.example) is not needed: the API tests
      # build their own in-memory D1 and never read .dev.vars.

      # Turbo's local cache: packages whose inputs did not change replay their
      # build/lint/typecheck/test results instead of re-running.
      - name: Cache turbo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-ci-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-ci-${{ runner.os }}-

      - name: Build packages
        run: pnpm build:packages

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  e2e:
    name: e2e
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      FITBUD_API_PORT: "8787"
      FITBUD_WEB_PORT: "5173"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node (.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          pnpm --version

      - name: Locate pnpm store
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Install Playwright browsers
        run: pnpm --filter @fitbud/trainer-web exec playwright install --with-deps chromium webkit

      # global-setup.ts runs db:reset, starts wrangler dev on FITBUD_API_PORT and waits for
      # the demo login; Playwright's webServer starts trainer-web on FITBUD_WEB_PORT.
      - name: Trainer-web e2e
        run: pnpm --filter @fitbud/trainer-web test:e2e

      - name: Upload report and API log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-report
          path: |
            apps/trainer-web/playwright-report
            apps/trainer-web/test-results
            /tmp/fitbud-api-e2e.log
          retention-days: 7

  banned-strings:
    name: banned-strings
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      FITBUD_API_PORT: "8787"
      FITBUD_WEB_PORT: "5173"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node (.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          pnpm --version

      - name: Locate pnpm store
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Install Playwright browser
        run: pnpm --filter @fitbud/trainer-web exec playwright install --with-deps chromium

      # Scans rendered UI text against docs/spec/banned-strings.json. Error-severity hits
      # on cleaned screens fail; the rest are reported only (see banned-strings.spec.ts).
      - name: Banned strings
        run: pnpm --filter @fitbud/trainer-web test:e2e:banned

      - name: Upload API log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: banned-strings-api-log
          path: /tmp/fitbud-api-e2e.log
          retention-days: 7
