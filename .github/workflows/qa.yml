      QA_SEED_SUITE: android
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node (.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          pnpm --version

      - name: Locate pnpm store
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Require the seed secrets
        env:
          FITBUD_QA_PASSWORD: ${{ secrets.FITBUD_QA_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "${FITBUD_QA_PASSWORD:-}" ] || missing="$missing FITBUD_QA_PASSWORD"
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error title=QA secrets missing::Set these in the staging-qa environment (QA1 manual steps 3 and 4):$missing"
            exit 1
          fi
          echo "Both seed secrets and the Cloudflare credentials are present."

      # QT2's scripts only write files; they refuse --remote themselves. tsx, not
      # node --experimental-strip-types: the scripts import .js specifiers that bare
      # type stripping cannot resolve (ERR_MODULE_NOT_FOUND).
      - name: Generate the android suite's reset and seed SQL
        env:
          FITBUD_QA_PASSWORD: ${{ secrets.FITBUD_QA_PASSWORD }}
        run: |
          pnpm --filter @fitbud/api exec tsx scripts/qa-reset.ts --suite "$QA_SEED_SUITE"
          pnpm --filter @fitbud/api exec tsx scripts/qa-seed.ts --suite "$QA_SEED_SUITE"

      # Reset first, then seed. The seed is ~5 MB over ~175 statements, with inserts
      # byte-capped by QT2 after a SQLITE_TOOBIG failure, so it applies as one file.
      - name: Apply the android suite's reset, then its seed, to fitbud-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # BEGIN d1-import-retry (Z5-7b; the same in every seed job, see seed-api)
          d1_execute() {
            local attempt=1 delay=15 out status
            while :; do
              if out="$(pnpm --filter @fitbud/api exec wrangler d1 execute fitbud-staging \
                --env staging --remote --yes "$@" 2>&1)"; then
                printf '%s\n' "$out"
                return 0
              else
                status=$?
              fi
              printf '%s\n' "$out"
              if ! grep -qF 'Currently processing a long-running import' <<<"$out"; then
                return "$status"
              fi
              if [ "$attempt" -ge 6 ]; then
                echo "::error title=D1 import still busy::Another import on fitbud-staging was still running after 6 attempts. Re-run this job once it has finished."
                return "$status"
              fi
              echo "::warning title=D1 import busy::Another import on fitbud-staging is still running (attempt $attempt of 6); retrying in ${delay}s."
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          # END d1-import-retry
          d1_execute --file ".qa-seed/$QA_SEED_SUITE/qa-reset.sql"
          d1_execute --file ".qa-seed/$QA_SEED_SUITE/qa-seed.sql"

  seed-ios:
    name: seed-ios
    # After its turn in the staging queue (queue-ios), like the ios job, and after
    # seed-android whatever its result: one D1 import at a time (Z5-7b, see seed-api).
    needs: [changes, queue-ios, seed-android]
    # Never on a pull request, and only from main. Both are asserted here, not inferred.
    # `!cancelled()` drops the default success(), so the queue job's success is checked
    # explicitly: without its turn the seed must not run.
    if: >-
