              fi
              printf '%s\n' "$out"
              if ! grep -qF 'Currently processing a long-running import' <<<"$out"; then
                return "$status"
              fi
              if [ "$attempt" -ge 6 ]; then
                echo "::error title=D1 import still busy::Another import on fitbud-staging was still running after 6 attempts. Re-run this job once it has finished."
                return "$status"
              fi
              echo "::warning title=D1 import busy::Another import on fitbud-staging is still running (attempt $attempt of 6); retrying in ${delay}s."
              sleep "$delay"
