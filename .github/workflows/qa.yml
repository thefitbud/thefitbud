# Automated end-to-end QA against staging (batch QA1 · QT7).
#
# `ci.yml` stays the PR gate and is not touched (D-QA1-6): lint, typecheck, unit tests,
# local Playwright and banned strings. This workflow adds, on top of it:
#
#   nightly 02:00 IST (30 20 * * * UTC) and on demand   reset + seed the QA accounts,
#       then the staging API smoke (QT6), the staging Playwright suite (QT5), the
#       Maestro Android suite (QT3), the same Maestro flows on an iOS simulator
#       (CU19) and the repo's unit run as JUnit
#   pull requests touching apps/mobile/** or packages/ui-mobile/**   the Maestro `smoke`
#       tag only, on both platforms, advisory: deliberately not required checks
#       (D-QA1-10). `ios` is not a required check either (D-W3b-14).
#   pull requests touching scripts/qa/**   the report builder's own tests, which no
#       other check can see (see the `qa-scripts` job)
#
# Every run, pass or fail, uploads one `qa-report` artifact built by scripts/qa/summarize.mjs
# (QT8). How to read it: docs/runbooks/qa-nightly.md.
#
# Secrets are referenced by name only and never echoed: QA_TEST_OTP_CODE,
# FITBUD_QA_PASSWORD, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. EXPO_TOKEN is not
# used (D-QA1-8). The only remote writes are the four `seed-<suite>` jobs, which run on
# `schedule` or `workflow_dispatch` from `main` only, inside the `staging-qa`
# environment (D-QA1-9).
#
# One persona set per suite (D-W5-14, Z5-7). `api` (the API smoke), `web`, `android`
# and `ios` each sign in as their own QA accounts (apps/api/src/seed/qa/accounts.ts) and
# each has its own seed job, `seed-<suite>`, which resets and reseeds that suite's
# accounts only (`qa-reset.ts --suite <suite>`, `qa-seed.ts --suite <suite>`). No suite
# can change what another suite reads, so the suites no longer queue behind each other:
# the old chain (one `qa-staging` group held in turn by seed-reset, api-smoke,
# web-staging, android and ios) is gone, and the four suites run side by side.
#
# One writer per QA world at a time is still enforced, per suite: `seed-<suite>` and the
# suite's own job hold `qa-staging-<suite>`, and the suite job `needs:` its seed job. Two
# runs of the SAME suite (a nightly and a PR smoke, or two PR smokes) still drive the
# same accounts, so the group stays for exactly that. `changes`, `qa-scripts`, `unit` and
# `report` stay outside every group.
#
# Staging queue for android and ios: QUEUE, NOT EVICT (Z5-24, W4 gap G22; replaces the
# "surfaced, not prevented" stance of D-W3b-26 for these two suites).
#
# The problem. `cancel-in-progress: false` keeps only ONE pending entry per concurrency
# group, so a third arrival cancels the older pending one. That is a documented platform
# property with no workflow-level knob. Observed, not theoretical: `android` was
# cancelled while pending on run 41783371236, and `ios` on run 41784737040 (D-W3b-34);
# in W5 every push to one mobile PR cancelled another PR's waiting android/ios run. A
# cancel sent to an in-progress macOS `ios` job is also not honoured mid-xcodebuild, so
# a stale run can hold the group until its 120-minute timeout.
#
# The fix. Each Maestro suite has a `queue-<suite>` job (ubuntu, a few seconds of work
# plus waiting) that runs before `seed-<suite>` and the suite job, which both `needs:` it.
# It waits, polling the Actions API read-only, until no run AHEAD of it in the queue still
# has its `<suite>` job unfinished; then it ends and the seed and suite jobs follow.
#
#   * Order. A run's place is the moment its `queue-<suite>` job started (ties: job id).
#     Every run computes the same total order, so two runs can never both pass, or both
#     wait for, each other. A queue job that has not started yet has no place: it will
#     start later, so it waits for us. "Re-run all jobs", or re-running `queue-<suite>`
#     (which re-runs its dependents), starts a new queue job, so that run goes to the
#     back.
#   * Partial re-runs. "Re-run failed jobs" or "Re-run this job" on `seed-<suite>` or
#     `<suite>` does NOT re-run `queue-<suite>`: GitHub carries its old success over.
#     So `queue-<suite>` outputs the `github.run_attempt` it ran in, and `seed-<suite>`
#     and `<suite>` run only when it equals their own attempt. Otherwise they are
#     skipped (never entering `qa-staging-<suite>`), and `report` puts an error in the
#     run summary saying to re-run all jobs or `queue-<suite>`; the suite reports
#     `not-run`, so the run is `partial`, never a pass.
#   * Cost. The script lists the open runs ahead of it once (after a 30 s settle, so a
#     queue job that started just before ours already reads as started), then each
#     minute re-reads only the OLDEST run still ahead (two API calls), since nothing
#     behind it can start first. Before passing it lists every open run once more, so a
#     run that came back with its old place while we waited is still waited for. Rate
#     limits, primary or secondary (403 with `retry-after`), are waited out.
#   * What "ahead and unfinished" means: that run is not completed, its queue job started
#     before ours, and its `<suite>` job is not completed. The suite job comes after the
#     seed job, so "the suite job is completed" covers the run's whole hold on the suite.
#     A cancel that is not honoured simply keeps the holder unfinished, and we wait.
#   * Fail safe. An API error never counts as a clear queue: the script keeps waiting
#     and, at QA_QUEUE_MAX_MINUTES (330, under the job's 340-minute timeout), fails the
#     queue job with an annotation. The suite is then skipped, reports `not-run`, and
#     the run `partial` — visible, never a silent pass, and never an overlap.
#   * Superseding. The queue job's own concurrency group is keyed per pull request with
#     `cancel-in-progress: true` on pull requests, so a newer push to the SAME pull
#     request replaces that pull request's own waiting run (no point testing a stale
#     commit). Every other run's group is its own run id. So the only cancellation left
#     is a PR replacing itself, and no run can cancel another PR's or main's run.
#   * The `qa-staging-<suite>` groups stay as a backstop and keep `cancel-in-progress:
#     false`. Behind the queue at most one run is ever inside them at a time (its seed
#     job, then its suite job), so they never hold a pending entry to evict.
#
# How this differs from the three options rejected earlier (D-W3b-26):
#
#   * Moving the group to the workflow level: still not done, for the same reasons (it
#     reduces no arrivals and drags `changes`, `unit`, `report` and the REQUIRED
#     `qa-scripts` check into the queue, forbidden by D-W3b-1).
#   * A gate job holding the group while the writers run behind it: rejected because
#     the group is released when the gate ENDS, before the writers start. The queue job
#     holds nothing. Later runs wait for an earlier run's SUITE job to complete, not for
#     its queue job, so the gap between a queue job ending and its writers starting is
#     covered.
#   * Refusing to start when another run is in flight: rejected because it turned an
#     eviction into a hard failure, needed an Actions token and still raced. The queue
#     WAITS instead of failing; its token is `actions: read` on the two queue jobs only
#     (no write scope anywhere, no checkout, the rest of the workflow keeps `contents:
#     read`); and the race is closed by the total order above, not by timing.
#
# The api and web suites keep the plain `qa-staging-api` / `qa-staging-web` groups:
# only nightly and dispatched runs from main use them, so they see few arrivals. Their
# eviction stays surfaced, not prevented: `report` is outside every group and `if:
# always()`, its "Evicted, not failed" step annotates any of their jobs that ended
# `cancelled`, summarize.mjs reports that suite `not-run` and the run `partial`, and the
# "Build the QA report" step then exits 3, so the run's conclusion is a failure, never a
# pass (Z5-6). Re-dispatch stays deliberate and by hand. The "Staging queue" step in
# `report` writes how android and ios took their turn into the run summary every time.
#
# `qa-scripts` is a required check on main (D-W3b-1) and a job inside a concurrency
# group can be left Pending, or cancelled when a newer run queues, so a required
# check must never sit in one.
#
# Artifacts never carry qa-results/web/test-output/**: Playwright writes error-context.md
# there on every failure, holding a full aria snapshot of the page including a typed
# password. Each suite job copies a named allowlist of files into qa-upload/ and uploads
# that directory, so nothing can arrive in the public artifact by accident.
name: QA

on:
  schedule:
    # 20:30 UTC = 02:00 IST.
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      suites:
        description: Which suites to run
        type: choice
        default: all
        options: [all, api, web, android, ios]
      tag:
        description: Maestro tag filter
        type: choice
        default: full
        options: [smoke, full]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Decides what this run does. Pull requests are classified by changed paths, the same
  # way ci.yml does it; schedule and workflow_dispatch always run everything they are
  # asked for.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      qa_scripts: ${{ steps.filter.outputs.qa_scripts }}
      staging: ${{ steps.plan.outputs.staging }}
      suites: ${{ steps.plan.outputs.suites }}
      tag: ${{ steps.plan.outputs.tag }}
      expect: ${{ steps.plan.outputs.expect }}
      trigger: ${{ steps.plan.outputs.trigger }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Classify changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            echo "qa_scripts=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE...$HEAD")
          echo "$files"
          # The scripts that build the apps, boot the devices and run Maestro count as
          # mobile too: a change to them can only be proven by the Maestro jobs (Z5-5).
          mobile=$(echo "$files" | grep -Ec '^(apps/mobile/|packages/ui-mobile/|scripts/qa/(build-android-apk|build-ios-sim|ios-build-helpers|sign-ios-simulator-app|simulator-keychain-entitlements|android-emulator-prep|android-system-image|run-maestro|run-maestro-ios)\.(sh|mjs)$)' || true)
          # scripts/qa/** is invisible to pnpm lint, pnpm typecheck and pnpm test
          # (pnpm-workspace.yaml covers apps/* and packages/* only), so this workflow
          # is the only place its tests can run. See the qa-scripts job.
          qa_scripts=$(echo "$files" | grep -Ec '^(scripts/qa/|\.github/workflows/qa\.yml)' || true)
          echo "mobile=$([ "$mobile" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "qa_scripts=$([ "$qa_scripts" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Plan the run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          IN_SUITES: ${{ inputs.suites }}
          IN_TAG: ${{ inputs.tag }}
        run: |
          case "$EVENT" in
            schedule)
              suites=all; tag=full; trigger="nightly"; staging=true ;;
            workflow_dispatch)
              suites="${IN_SUITES:-all}"; tag="${IN_TAG:-full}"; trigger="manual"; staging=true
              if [ "$GIT_REF" != "refs/heads/main" ]; then
                echo "::error title=Wrong ref::qa.yml writes the shared staging QA accounts, so it may only be dispatched from main (D-QA1-6). Got $GIT_REF."
                exit 1
              fi ;;
            *)
              # Pull requests: the Maestro smoke tag only, on both platforms, and they
              # never write staging. The suites value stays `android` so the android
              # job's own gate is untouched; `expect` below names both platforms,
              # because both jobs run on a mobile pull request.
              suites=android; tag=smoke; trigger="pr"; staging=false; pr=true ;;
          esac
          case "$suites" in
            all) expect="mobile,ios,web,api,unit" ;;
            api) expect=api ;;
            web) expect=web ;;
            # A dispatched `android` run asks for the Android suite alone; a pull
            # request runs both Maestro jobs, so it expects both reports and a
            # missing one shows up as not-run rather than being left out.
            android)
              if [ "${pr:-false}" = "true" ]; then expect="mobile,ios"; else expect=mobile; fi ;;
            ios) expect=ios ;;
            *) echo "::error::unknown suites value \"$suites\""; exit 1 ;;
          esac
          {
            echo "suites=$suites"
            echo "tag=$tag"
            echo "trigger=$trigger"
            echo "staging=$staging"
            echo "expect=$expect"
          } >> "$GITHUB_OUTPUT"
          echo "suites=$suites tag=$tag trigger=$trigger staging=$staging expect=$expect"

  # The report builder's own tests. scripts/qa is outside the pnpm workspace, has no
  # ESLint config above it and declares no turbo task, so `pnpm lint`, `pnpm typecheck`
  # and `pnpm test` all walk straight past it. QT8 merged with three failing tests and a
  # fixture that reported `pass` where it should have failed, because nothing ran them.
  # This job is that signal, and it runs on any PR that touches scripts/qa/** even though
  # the rest of this workflow is nightly and mobile-scoped.
  qa-scripts:
    name: qa-scripts
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || github.event_name != 'pull_request' || needs.changes.outputs.qa_scripts == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node (.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # Node 22 needs the quoted glob; a bare directory is rejected. No dependencies:
      # summarize.mjs and its tests use Node built-ins only.
      - name: Report builder tests
        run: node --test "scripts/qa/**/*.test.mjs"

  # The staging queue for the Maestro suites: queue, not evict (Z5-24). See "Staging
  # queue" at the top of this file. `queue-android` and `queue-ios` are the same apart
  # from the suite name; scripts/qa/staging-queue.test.mjs checks the two scripts are
  # identical and runs the script against a fake GitHub API.
  queue-android:
    name: queue-android
    needs: changes
    # Exactly when the android suite will run (the android job's own gate, minus its seed).
    if: >-
      ${{ (needs.changes.outputs.staging == 'true'
           && (needs.changes.outputs.suites == 'all' || needs.changes.outputs.suites == 'android'))
          || (github.event_name == 'pull_request' && needs.changes.outputs.mobile == 'true') }}
    runs-on: ubuntu-latest
    # The script gives up at QA_QUEUE_MAX_MINUTES, before this, so it can say why.
    timeout-minutes: 340
    # Read the Actions API to see the queue; nothing else, and no checkout.
    permissions:
      actions: read
    # The attempt this turn was taken in. "Re-run failed jobs" and "Re-run this job" on
    # seed-android or android carry this job's old success over without running it again,
    # so both of them refuse to run unless this equals their own github.run_attempt.
    outputs:
      attempt: ${{ github.run_attempt }}
    # Keyed per pull request: a newer push to the SAME pull request replaces that pull
    # request's own waiting run here, and nothing else. Every other run has a group of
    # its own (the run id), so no run can cancel another run's place in the queue.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('qa-queue-android-pr-{0}', github.event.pull_request.number) || format('qa-queue-android-run-{0}', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Wait for earlier runs of the android suite
        env:
          GH_TOKEN: ${{ github.token }}
          QA_QUEUE_SUITE: android
          QA_QUEUE_POLL_SECONDS: "60"
          QA_QUEUE_SETTLE_SECONDS: "30"
          QA_QUEUE_MAX_MINUTES: "330"
        run: |
          node --input-type=module <<'QA_QUEUE_JS'
          import { appendFileSync } from "node:fs";

          const env = process.env;
          const API = (env.GITHUB_API_URL || "https://api.github.com").replace(/\/$/, "");
          const REPO = env.GITHUB_REPOSITORY;
          const RUN_ID = String(env.GITHUB_RUN_ID);
          const SUITE = env.QA_QUEUE_SUITE;
          const QUEUE_JOB = `queue-${SUITE}`;
          const POLL_MS = Number(env.QA_QUEUE_POLL_SECONDS || "60") * 1000;
          // Pause before the first full listing, so a queue job that started just before ours
          // already reads as started in the API (it reads as `queued` for a moment).
          const SETTLE_MS = Number(env.QA_QUEUE_SETTLE_SECONDS || "30") * 1000;
          const MAX_MS = Number(env.QA_QUEUE_MAX_MINUTES || "330") * 60 * 1000;
          // Every status a run that has not finished can have.
          const OPEN = ["in_progress", "queued", "waiting", "pending", "requested"];

          // A failure that waiting cannot fix (no permission, this run's own queue job missing).
          class Fatal extends Error {}

          function summary(lines) {
            if (env.GITHUB_STEP_SUMMARY) appendFileSync(env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n\n`);
          }

          async function get(path) {
            let res;
            try {
              res = await fetch(API + path, {
                headers: {
                  authorization: `Bearer ${env.GH_TOKEN}`,
                  accept: "application/vnd.github+json",
                  "x-github-api-version": "2022-11-28",
                },
              });
            } catch (error) {
              throw new Error(`no answer from the GitHub API on ${path} (${error.name})`);
            }
            if (res.ok) return res.json();
            const message = `the GitHub API answered ${res.status} on ${path}`;
            const body = await res.text().catch(() => "");
            const retryAfter = Number(res.headers.get("retry-after"));
            // Rate limits, primary or secondary, and server errors pass with time: wait them out.
            const limited =
              res.status === 429 ||
              res.headers.get("x-ratelimit-remaining") === "0" ||
              (res.status === 403 && ((Number.isFinite(retryAfter) && retryAfter > 0) || /secondary rate limit/i.test(body)));
            const error = res.status >= 500 || limited ? new Error(message) : new Fatal(message);
            error.status = res.status;
            if (Number.isFinite(retryAfter) && retryAfter > 0) error.retryAfterMs = retryAfter * 1000;
            throw error;
          }

          async function pages(path, field) {
            const all = [];
            for (let page = 1; ; page += 1) {
              const body = await get(`${path}${path.includes("?") ? "&" : "?"}per_page=100&page=${page}`);
              const items = body[field] ?? [];
              all.push(...items);
              if (items.length < 100) return all;
            }
          }

          const jobsOf = (runId) => pages(`/repos/${REPO}/actions/runs/${runId}/jobs?filter=latest`, "jobs");

          // A run's place in the queue is the moment its queue job STARTED, ties broken by job
          // id. A queue job that has not started has no place yet: it will start after ours, so
          // it waits for us, not we for it. Re-running the workflow, or queue-<suite>, starts a
          // new queue job, so that run goes to the back. Every run computes the same order, so
          // two runs can never both wait for, or both pass, each other.
          function placeOf(job) {
            if (!job || job.status === "queued" || job.conclusion === "skipped" || !job.started_at) return null;
            return [Date.parse(job.started_at), Number(job.id)];
          }
          const isAhead = (a, b) => a[0] < b[0] || (a[0] === b[0] && a[1] < b[1]);

          // The run's place if it is ahead of this one and has not finished its suite job,
          // otherwise null.
          function holdingPlace(run, jobs, mine) {
            if (run.status === "completed") return null;
            const place = placeOf(jobs.find((job) => job.name === QUEUE_JOB));
            if (!place || !isAhead(place, mine)) return null;
            const suiteJob = jobs.find((job) => job.name === SUITE);
            return suiteJob && suiteJob.status === "completed" ? null : place;
          }

          const label = (run) => {
            const pr = run.pull_requests?.[0]?.number;
            return `run #${run.run_number} (${pr ? `PR #${pr}` : run.event})`;
          };

          // Every open run of this workflow that holds the suite ahead of us, oldest first.
          async function listHolders(workflowId, mine) {
            const open = new Map();
            for (const status of OPEN) {
              for (const run of await pages(`/repos/${REPO}/actions/workflows/${workflowId}/runs?status=${status}`, "workflow_runs")) {
                if (String(run.id) !== RUN_ID) open.set(String(run.id), run);
              }
            }
            const found = [];
            for (const [id, run] of open) {
              const place = holdingPlace(run, await jobsOf(id), mine);
              if (place) found.push({ id, run, place });
            }
            return found.sort((a, b) => (isAhead(a.place, b.place) ? -1 : 1));
          }

          if (!env.GH_TOKEN || !REPO || !SUITE || !env.GITHUB_RUN_ID) {
            console.log("::error title=Staging queue misconfigured::GH_TOKEN, GITHUB_REPOSITORY, GITHUB_RUN_ID and QA_QUEUE_SUITE must all be set.");
            process.exit(1);
          }

          const started = Date.now();
          const minutes = () => Math.round((Date.now() - started) / 60000);
          let mine = null;
          let workflowId = null;
          // Runs ahead of this one that still hold the suite, oldest first. Each poll re-reads
          // only the OLDEST (two API calls), because nothing behind it can start before it ends.
          // That keeps every waiting run at a constant cost per poll however long the queue is.
          // The full listing runs once at the start and once more before passing, so a run that
          // came back while we waited (a re-run that kept its old place) is still waited for.
          let holders = null;
          const waitedFor = new Map();

          for (;;) {
            let pause = POLL_MS;
            try {
              if (!mine) {
                const self = await get(`/repos/${REPO}/actions/runs/${RUN_ID}`);
                const place = placeOf((await jobsOf(RUN_ID)).find((job) => job.name === QUEUE_JOB));
                if (!place) throw new Fatal(`this run has no started ${QUEUE_JOB} job to take a place in the queue`);
                workflowId = self.workflow_id;
                mine = place;
                await new Promise((resolve) => setTimeout(resolve, SETTLE_MS));
              }
              if (!holders) holders = await listHolders(workflowId, mine);
              while (holders.length > 0) {
                const oldest = holders[0];
                let run;
                try {
                  run = await get(`/repos/${REPO}/actions/runs/${oldest.id}`);
                } catch (error) {
                  // A deleted run holds nothing.
                  if (error.status !== 404) throw error;
                  holders.shift();
                  continue;
                }
                waitedFor.set(oldest.id, label(run));
                if (holdingPlace(run, run.status === "completed" ? [] : await jobsOf(oldest.id), mine)) break;
                holders.shift();
              }
              if (holders.length === 0) {
                // Before passing, look again at every open run, not just the ones listed first.
                holders = await listHolders(workflowId, mine);
                for (const holder of holders) waitedFor.set(holder.id, label(holder.run));
              }
              if (holders.length === 0) {
                const behind = [...waitedFor.values()];
                const line =
                  behind.length === 0
                    ? `No earlier run held the ${SUITE} suite's QA accounts, so the ${SUITE} job starts at once.`
                    : `Waited ${minutes()} min for ${behind.join(", ")} to finish its ${SUITE} job, then took the ${SUITE} suite's QA accounts.`;
                console.log(line);
                summary([
                  `### ${SUITE} staging queue`,
                  "",
                  line,
                  "",
                  `Runs take the ${SUITE} suite's QA accounts one at a time, in the order their \`${QUEUE_JOB}\` job started. A newer run waits here and never cancels an older run's ${SUITE} job (Z5-24). Only a newer push to the same pull request replaces that pull request's own waiting run.`,
                ]);
                process.exit(0);
              }
              console.log(`Waiting (${minutes()} min so far) for ${label(holders[0].run)} to finish its ${SUITE} job (${holders.length} run(s) ahead).`);
            } catch (error) {
              if (error instanceof Fatal) {
                console.log(`::error title=Staging queue failed::${error.message}. The ${SUITE} suite did not run, so it reports not-run and this run partial.`);
                summary([`### ${SUITE} staging queue`, "", `Could not read the queue: ${error.message}. The ${SUITE} suite did not run.`]);
                process.exit(1);
              }
              // Never pass on an error: an unreadable queue counts as a busy one.
              console.log(`::warning title=Staging queue unreadable::${error.message}. Still waiting; an error never counts as a clear queue.`);
              if (error.retryAfterMs) pause = Math.max(POLL_MS, error.retryAfterMs);
            }
            const left = MAX_MS - (Date.now() - started);
            if (left <= 0) {
              const holding = holders && holders.length > 0 ? holders.map((holder) => label(holder.run)).join(", ") : "a queue it could not read";
              console.log(`::error title=Staging queue timed out::Waited ${minutes()} min for ${holding}. The ${SUITE} suite did not run, so it reports not-run and this run partial. Re-run this job once that run has finished.`);
              summary([
                `### ${SUITE} staging queue`,
                "",
                `Gave up after ${minutes()} min waiting for ${holding}. The ${SUITE} suite did not run. It was not evicted, and this is not a failure of the code under test.`,
              ]);
              process.exit(1);
            }
            // A long retry-after is honoured up to the give-up time, then polled once more.
            await new Promise((resolve) => setTimeout(resolve, Math.min(pause, left)));
          }
          QA_QUEUE_JS

  queue-ios:
    name: queue-ios
    needs: changes
    # Exactly when the ios suite will run (the ios job's own gate, minus its seed).
    if: >-
      ${{ (needs.changes.outputs.staging == 'true'
           && (needs.changes.outputs.suites == 'all' || needs.changes.outputs.suites == 'ios'))
          || (github.event_name == 'pull_request' && needs.changes.outputs.mobile == 'true') }}
    runs-on: ubuntu-latest
    # The script gives up at QA_QUEUE_MAX_MINUTES, before this, so it can say why.
    timeout-minutes: 340
    # Read the Actions API to see the queue; nothing else, and no checkout.
    permissions:
      actions: read
    # The attempt this turn was taken in. "Re-run failed jobs" and "Re-run this job" on
    # seed-ios or ios carry this job's old success over without running it again,
    # so both of them refuse to run unless this equals their own github.run_attempt.
    outputs:
      attempt: ${{ github.run_attempt }}
    # Keyed per pull request: a newer push to the SAME pull request replaces that pull
    # request's own waiting run here, and nothing else. Every other run has a group of
    # its own (the run id), so no run can cancel another run's place in the queue.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('qa-queue-ios-pr-{0}', github.event.pull_request.number) || format('qa-queue-ios-run-{0}', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Wait for earlier runs of the ios suite
        env:
          GH_TOKEN: ${{ github.token }}
          QA_QUEUE_SUITE: ios
          QA_QUEUE_POLL_SECONDS: "60"
          QA_QUEUE_SETTLE_SECONDS: "30"
          QA_QUEUE_MAX_MINUTES: "330"
        run: |
          node --input-type=module <<'QA_QUEUE_JS'
          import { appendFileSync } from "node:fs";

          const env = process.env;
          const API = (env.GITHUB_API_URL || "https://api.github.com").replace(/\/$/, "");
          const REPO = env.GITHUB_REPOSITORY;
          const RUN_ID = String(env.GITHUB_RUN_ID);
          const SUITE = env.QA_QUEUE_SUITE;
          const QUEUE_JOB = `queue-${SUITE}`;
          const POLL_MS = Number(env.QA_QUEUE_POLL_SECONDS || "60") * 1000;
          // Pause before the first full listing, so a queue job that started just before ours
          // already reads as started in the API (it reads as `queued` for a moment).
          const SETTLE_MS = Number(env.QA_QUEUE_SETTLE_SECONDS || "30") * 1000;
          const MAX_MS = Number(env.QA_QUEUE_MAX_MINUTES || "330") * 60 * 1000;
          // Every status a run that has not finished can have.
          const OPEN = ["in_progress", "queued", "waiting", "pending", "requested"];

          // A failure that waiting cannot fix (no permission, this run's own queue job missing).
          class Fatal extends Error {}

          function summary(lines) {
            if (env.GITHUB_STEP_SUMMARY) appendFileSync(env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n\n`);
          }

          async function get(path) {
            let res;
            try {
              res = await fetch(API + path, {
                headers: {
                  authorization: `Bearer ${env.GH_TOKEN}`,
                  accept: "application/vnd.github+json",
                  "x-github-api-version": "2022-11-28",
                },
              });
            } catch (error) {
              throw new Error(`no answer from the GitHub API on ${path} (${error.name})`);
            }
            if (res.ok) return res.json();
            const message = `the GitHub API answered ${res.status} on ${path}`;
            const body = await res.text().catch(() => "");
            const retryAfter = Number(res.headers.get("retry-after"));
            // Rate limits, primary or secondary, and server errors pass with time: wait them out.
            const limited =
              res.status === 429 ||
              res.headers.get("x-ratelimit-remaining") === "0" ||
              (res.status === 403 && ((Number.isFinite(retryAfter) && retryAfter > 0) || /secondary rate limit/i.test(body)));
            const error = res.status >= 500 || limited ? new Error(message) : new Fatal(message);
            error.status = res.status;
            if (Number.isFinite(retryAfter) && retryAfter > 0) error.retryAfterMs = retryAfter * 1000;
            throw error;
          }

          async function pages(path, field) {
            const all = [];
            for (let page = 1; ; page += 1) {
              const body = await get(`${path}${path.includes("?") ? "&" : "?"}per_page=100&page=${page}`);
              const items = body[field] ?? [];
              all.push(...items);
              if (items.length < 100) return all;
            }
          }

          const jobsOf = (runId) => pages(`/repos/${REPO}/actions/runs/${runId}/jobs?filter=latest`, "jobs");

          // A run's place in the queue is the moment its queue job STARTED, ties broken by job
          // id. A queue job that has not started has no place yet: it will start after ours, so
          // it waits for us, not we for it. Re-running the workflow, or queue-<suite>, starts a
          // new queue job, so that run goes to the back. Every run computes the same order, so
          // two runs can never both wait for, or both pass, each other.
          function placeOf(job) {
            if (!job || job.status === "queued" || job.conclusion === "skipped" || !job.started_at) return null;
            return [Date.parse(job.started_at), Number(job.id)];
          }
          const isAhead = (a, b) => a[0] < b[0] || (a[0] === b[0] && a[1] < b[1]);

          // The run's place if it is ahead of this one and has not finished its suite job,
          // otherwise null.
          function holdingPlace(run, jobs, mine) {
            if (run.status === "completed") return null;
            const place = placeOf(jobs.find((job) => job.name === QUEUE_JOB));
            if (!place || !isAhead(place, mine)) return null;
            const suiteJob = jobs.find((job) => job.name === SUITE);
            return suiteJob && suiteJob.status === "completed" ? null : place;
          }

          const label = (run) => {
            const pr = run.pull_requests?.[0]?.number;
            return `run #${run.run_number} (${pr ? `PR #${pr}` : run.event})`;
          };

          // Every open run of this workflow that holds the suite ahead of us, oldest first.
          async function listHolders(workflowId, mine) {
            const open = new Map();
            for (const status of OPEN) {
              for (const run of await pages(`/repos/${REPO}/actions/workflows/${workflowId}/runs?status=${status}`, "workflow_runs")) {
                if (String(run.id) !== RUN_ID) open.set(String(run.id), run);
              }
            }
            const found = [];
            for (const [id, run] of open) {
              const place = holdingPlace(run, await jobsOf(id), mine);
              if (place) found.push({ id, run, place });
            }
            return found.sort((a, b) => (isAhead(a.place, b.place) ? -1 : 1));
          }

          if (!env.GH_TOKEN || !REPO || !SUITE || !env.GITHUB_RUN_ID) {
            console.log("::error title=Staging queue misconfigured::GH_TOKEN, GITHUB_REPOSITORY, GITHUB_RUN_ID and QA_QUEUE_SUITE must all be set.");
            process.exit(1);
          }

          const started = Date.now();
          const minutes = () => Math.round((Date.now() - started) / 60000);
          let mine = null;
          let workflowId = null;
          // Runs ahead of this one that still hold the suite, oldest first. Each poll re-reads
          // only the OLDEST (two API calls), because nothing behind it can start before it ends.
          // That keeps every waiting run at a constant cost per poll however long the queue is.
          // The full listing runs once at the start and once more before passing, so a run that
          // came back while we waited (a re-run that kept its old place) is still waited for.
          let holders = null;
          const waitedFor = new Map();

          for (;;) {
            let pause = POLL_MS;
            try {
              if (!mine) {
                const self = await get(`/repos/${REPO}/actions/runs/${RUN_ID}`);
                const place = placeOf((await jobsOf(RUN_ID)).find((job) => job.name === QUEUE_JOB));
                if (!place) throw new Fatal(`this run has no started ${QUEUE_JOB} job to take a place in the queue`);
                workflowId = self.workflow_id;
                mine = place;
                await new Promise((resolve) => setTimeout(resolve, SETTLE_MS));
              }
              if (!holders) holders = await listHolders(workflowId, mine);
              while (holders.length > 0) {
                const oldest = holders[0];
                let run;
                try {
                  run = await get(`/repos/${REPO}/actions/runs/${oldest.id}`);
                } catch (error) {
                  // A deleted run holds nothing.
                  if (error.status !== 404) throw error;
                  holders.shift();
                  continue;
                }
                waitedFor.set(oldest.id, label(run));
                if (holdingPlace(run, run.status === "completed" ? [] : await jobsOf(oldest.id), mine)) break;
                holders.shift();
              }
              if (holders.length === 0) {
                // Before passing, look again at every open run, not just the ones listed first.
                holders = await listHolders(workflowId, mine);
                for (const holder of holders) waitedFor.set(holder.id, label(holder.run));
              }
              if (holders.length === 0) {
                const behind = [...waitedFor.values()];
                const line =
                  behind.length === 0
                    ? `No earlier run held the ${SUITE} suite's QA accounts, so the ${SUITE} job starts at once.`
                    : `Waited ${minutes()} min for ${behind.join(", ")} to finish its ${SUITE} job, then took the ${SUITE} suite's QA accounts.`;
                console.log(line);
                summary([
                  `### ${SUITE} staging queue`,
                  "",
                  line,
                  "",
                  `Runs take the ${SUITE} suite's QA accounts one at a time, in the order their \`${QUEUE_JOB}\` job started. A newer run waits here and never cancels an older run's ${SUITE} job (Z5-24). Only a newer push to the same pull request replaces that pull request's own waiting run.`,
                ]);
                process.exit(0);
              }
              console.log(`Waiting (${minutes()} min so far) for ${label(holders[0].run)} to finish its ${SUITE} job (${holders.length} run(s) ahead).`);
            } catch (error) {
              if (error instanceof Fatal) {
                console.log(`::error title=Staging queue failed::${error.message}. The ${SUITE} suite did not run, so it reports not-run and this run partial.`);
                summary([`### ${SUITE} staging queue`, "", `Could not read the queue: ${error.message}. The ${SUITE} suite did not run.`]);
                process.exit(1);
              }
              // Never pass on an error: an unreadable queue counts as a busy one.
              console.log(`::warning title=Staging queue unreadable::${error.message}. Still waiting; an error never counts as a clear queue.`);
              if (error.retryAfterMs) pause = Math.max(POLL_MS, error.retryAfterMs);
            }
            const left = MAX_MS - (Date.now() - started);
            if (left <= 0) {
              const holding = holders && holders.length > 0 ? holders.map((holder) => label(holder.run)).join(", ") : "a queue it could not read";
              console.log(`::error title=Staging queue timed out::Waited ${minutes()} min for ${holding}. The ${SUITE} suite did not run, so it reports not-run and this run partial. Re-run this job once that run has finished.`);
              summary([
                `### ${SUITE} staging queue`,
                "",
                `Gave up after ${minutes()} min waiting for ${holding}. The ${SUITE} suite did not run. It was not evicted, and this is not a failure of the code under test.`,
              ]);
              process.exit(1);
            }
            // A long retry-after is honoured up to the give-up time, then polled once more.
            await new Promise((resolve) => setTimeout(resolve, Math.min(pause, left)));
          }
          QA_QUEUE_JS

  # The only remote writes in this repository's CI: one job per QA suite (D-W5-14).
  # Each applies QT2's reset then its seed to fitbud-staging, in that order, scoped to
  # that suite's QA user ids only (`--suite`), so it never touches another suite's
  # accounts. The four jobs are the same apart from the suite name; a change to one is a
  # change to all four (apps/api/scripts/qa-seed-suites.test.ts checks the wiring).
  #
  # ONE D1 IMPORT AT A TIME (Z5-7b). Every `wrangler d1 execute --remote --file` is a D1
  # import, and a D1 database accepts only one import at a time; a second one is refused
  # with "Currently processing a long-running import. Cannot start another import until
  # that completes or times out." (run 42079586761: seed-ios lost that race to the other
  # three seeds, which all started together). Two guards, pinned by
  # scripts/qa/seed-serial.test.mjs:
  #
  #   * Within a run, deterministically: the seeds are a chain, seed-api -> seed-web ->
  #     seed-android -> seed-ios, each `needs:` the one before. Each later link is gated
  #     with `!cancelled()`, not the default success(), so a seed that was SKIPPED (its
  #     suite not selected, or a partial re-run's queue-attempt check), FAILED or was
  #     CANCELLED earlier in the chain never takes a later suite's seed with it: a broken
  #     api seed must not cost ios its seed. Only a cancelled run stops the chain. Every
  #     link keeps all of its own gates (main only, `staging-qa`, its suite, and for
  #     android and ios its queue job's success and attempt), so the chain only orders
  #     the imports; it never runs a seed its own gates would not. The cost: seed-ios
  #     (and so ios) can wait for queue-android's turn; the mobile queues never wait for
  #     api or web.
  #   * Across runs (a nightly overlapping a dispatch seeds different suites, so their
  #     groups do not exclude each other): d1_execute retries an import ONLY when wrangler
  #     reports exactly that message, 6 attempts with 15/30/60/120/240 s between them.
  #     A refused import never started, so retrying it applies nothing twice. Any other
  #     error fails at once, as before.
  seed-api:
    name: seed-api
    needs: changes
    # Never on a pull request, and only from main. Both are asserted here, not inferred.
    if: >-
      ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
          && needs.changes.outputs.staging == 'true'
          && (needs.changes.outputs.suites == 'all' || needs.changes.outputs.suites == 'api') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging-qa
    # One writer per QA world at a time; see the note at the top of this file.
    concurrency:
      group: qa-staging-api
      cancel-in-progress: false
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      QA_SEED_SUITE: api
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node (.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          pnpm --version

      - name: Locate pnpm store
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Require the seed secrets
        env:
          FITBUD_QA_PASSWORD: ${{ secrets.FITBUD_QA_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "${FITBUD_QA_PASSWORD:-}" ] || missing="$missing FITBUD_QA_PASSWORD"
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error title=QA secrets missing::Set these in the staging-qa environment (QA1 manual steps 3 and 4):$missing"
            exit 1
          fi
          echo "Both seed secrets and the Cloudflare credentials are present."

      # QT2's scripts only write files; they refuse --remote themselves. tsx, not
      # node --experimental-strip-types: the scripts import .js specifiers that bare
      # type stripping cannot resolve (ERR_MODULE_NOT_FOUND).
      - name: Generate the api suite's reset and seed SQL
        env:
          FITBUD_QA_PASSWORD: ${{ secrets.FITBUD_QA_PASSWORD }}
        run: |
          pnpm --filter @fitbud/api exec tsx scripts/qa-reset.ts --suite "$QA_SEED_SUITE"
          pnpm --filter @fitbud/api exec tsx scripts/qa-seed.ts --suite "$QA_SEED_SUITE"

      # Reset first, then seed. The seed is ~5 MB over ~175 statements, with inserts
      # byte-capped by QT2 after a SQLITE_TOOBIG failure, so it applies as one file.
      - name: Apply the api suite's reset, then its seed, to fitbud-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # BEGIN d1-import-retry (Z5-7b; the same in every seed job, see seed-api)
          d1_execute() {
            local attempt=1 delay=15 out status
            while :; do
              if out="$(pnpm --filter @fitbud/api exec wrangler d1 execute fitbud-staging \
                --env staging --remote --yes "$@" 2>&1)"; then
                printf '%s\n' "$out"
                return 0
              else
                status=$?
              fi
              printf '%s\n' "$out"
              if ! grep -qF 'Currently processing a long-running import' <<<"$out"; then
                return "$status"
              fi
              if [ "$attempt" -ge 6 ]; then
                echo "::error title=D1 import still busy::Another import on fitbud-staging was still running after 6 attempts. Re-run this job once it has finished."
                return "$status"
              fi
              echo "::warning title=D1 import busy::Another import on fitbud-staging is still running (attempt $attempt of 6); retrying in ${delay}s."
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          # END d1-import-retry
          d1_execute --file ".qa-seed/$QA_SEED_SUITE/qa-reset.sql"
          d1_execute --file ".qa-seed/$QA_SEED_SUITE/qa-seed.sql"

