          d1_execute --file ".qa-seed/$QA_SEED_SUITE/qa-reset.sql"
          d1_execute --file ".qa-seed/$QA_SEED_SUITE/qa-seed.sql"

  seed-android:
    name: seed-android
    # After its turn in the staging queue (queue-android), like the android job, and after
    # seed-web whatever its result: one D1 import at a time (Z5-7b, see seed-api).
    needs: [changes, queue-android, seed-web]
