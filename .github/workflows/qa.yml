          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # BEGIN d1-import-retry (Z5-7b; the same in every seed job, see seed-api)
          d1_execute() {
            local attempt=1 delay=15 out status
            while :; do
              if out="$(pnpm --filter @fitbud/api exec wrangler d1 execute fitbud-staging \
