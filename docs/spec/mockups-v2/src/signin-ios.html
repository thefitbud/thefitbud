<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><title>FitBud · Sign in (iOS)</title><link rel="stylesheet" href="tokens.css">{{> signin-style}}</head>
<body><div class="phone ios m">
  <div class="auth-hero"><div class="lg"><img src="assets/mark-white.svg" alt=""><b>FitBud</b></div><p>Progress, guided.</p></div>
  {{sb-ios:7:24}}
  <div class="sheet">
    <h1>Sign in</h1>
    <p class="lead">Your coach's plan for today is waiting.</p>
    <div class="mfield"><label>Mobile number or email</label><div class="minput focus"><ic n="mail"></ic>aarav.shah@gmail.com</div></div>
    <div class="mfield"><label>Password</label><div class="minput"><ic n="lock"></ic><span style="letter-spacing:3px">•••••••••</span><span class="eye" aria-label="Show password"><ic n="eye"></ic></span></div></div>
    <div class="frow"><button class="mbtn text" style="font-size:15px">Forgot password?</button></div>
    <button class="mbtn primary xl block" style="margin-top:6px">Sign in</button>
    <div class="center" style="margin-top:10px"><button class="mbtn text"><ic n="mail"></ic>Sign in with a code instead</button></div>
    <div class="needhelp"><a href="mailto:tech@thefitbud.com">Need help?</a></div>
  </div>
  <div class="home-ind" data-chrome></div>
</div><script>document.querySelector('.sb').classList.add('light')</script></body></html>
