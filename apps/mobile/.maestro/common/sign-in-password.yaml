# Subflow (QT3): sign in with email and password (QA trainer and on-track
# trainee only; the slipping account is code-only).
#
# Inputs (env):
#   SIGN_IN_EMAIL  a qa+...@thefitbud.com address, passed by the caller
#   QA_PASSWORD    from the runner: the public demo password in the device gate (run-gate.sh);
#                  the GitHub secret FITBUD_QA_PASSWORD in the nightly QA workflow
#
# Takes no screenshot. The password field is masked, but there is still no
# reason to publish a half-filled form. Ends on the signed-in home: trainee
# Today, trainer "Needs you", or role select.
# Maestro parses every file reached by `runFlow:` as a flow in its own right, so
# this subflow needs a config section and the `---` separator even though it only
# ever runs from a caller, and `appId` in that section is required rather than
# inherited (CU18; the full reasoning is in common/assert-no-crash.yaml). The
# value is inert for a subflow -- the calling flow's config governs -- and no
# `tags:` are set, so this file is never collected as a top-level flow.
appId: com.thefitbud.mobile.staging
---
- extendedWaitUntil:
    visible: "Sign in with a code instead"
    timeout: 60000
- tapOn: "you@example.com or 9876543210"
# Clear before type: leftover or autofill characters can append a garbage suffix
# (dark launch smoke typed aarav.ontrack@demo.fitbud.testntr → wrong password).
- eraseText: 80
- inputText: ${SIGN_IN_EMAIL}
# Exact email only (Maestro Regex.matches on the whole string). A trailing .*
# used to accept garbage suffixes. Retype once when the field does not match.
- runFlow:
    when:
      notVisible: "${SIGN_IN_EMAIL}"
    commands:
      - eraseText: 80
      - inputText: ${SIGN_IN_EMAIL}
- assertVisible: "${SIGN_IN_EMAIL}"
- tapOn: "Your password"
- inputText: ${QA_PASSWORD}
# Dismiss the keyboard by tapping inert text: the sign-in sheet is a ScrollView
# with keyboardShouldPersistTaps="handled", so this works on iOS and Android.
# Maestro's hideKeyboard cannot dismiss the iOS keyboard here (Z5-5, #241).
- tapOn: "Use the mobile number or email your coach invited\\."
# Password focus can clear the email field (Android dark launch 44484383185:
# empty email, filled password, still on the sign-in sheet). Re-enter once.
- runFlow:
    when:
      notVisible: "${SIGN_IN_EMAIL}"
    commands:
      - tapOn: "you@example.com or 9876543210"
      - eraseText: 80
      - inputText: ${SIGN_IN_EMAIL}
      - assertVisible: "${SIGN_IN_EMAIL}"
      - tapOn: "Your password"
      - inputText: ${QA_PASSWORD}
      - tapOn: "Use the mobile number or email your coach invited\\."
# "Sign in" is also the screen title; the button is the one under "Forgot password?".
# The anchor matches with or without the "?": that link is a Pressable with
# accessibilityLabel="Forgot password" (SignInScreen.tsx), and iOS exposes only
# that label, while Android also exposes the inner "Forgot password?" text
# (Z5-5b, cause 8: job 127176024926, "Element not found ... Below: Forgot password\?").
- tapOn:
    text: "Sign in"
    below: "Forgot password\\??"
# Home proof after sign-in. "Today's workout.*" still matches a rest-day iOS label
# (Z12-35). "This week" is above the fold on Z12-46 Today when a push/check-in
# review banner covers the header (FitBud #485 / #502). Trainer Attention and
# role select keep their markers.
- extendedWaitUntil:
    visible: "Today's workout.*|This week|Needs you.*|Choose mode"
    timeout: 60000
# A foreground check-in review banner can cover the header for ~4 s (TR-06h /
# ReviewedBanner). Wait it out before callers assert on Today content.
- runFlow:
    when:
      visible: ".*reviewed your check-in.*"
    commands:
      - extendedWaitUntil:
          notVisible: ".*reviewed your check-in.*"
          timeout: 15000
