# Subflow (QT3): sign in with email and password (QA trainer and on-track
# trainee only; the slipping account is code-only).
#
# Inputs (env):
#   SIGN_IN_EMAIL  a qa+...@thefitbud.com address, passed by the caller
#   QA_PASSWORD    from the runner (GitHub secret FITBUD_QA_PASSWORD)
#
# Takes no screenshot. The password field is masked, but there is still no
# reason to publish a half-filled form. Ends on the signed-in home: trainee
# Today, trainer "Needs you", or role select.
# Maestro parses every file reached by `runFlow:` as a flow in its own right, so
# this subflow needs a config section and the `---` separator even though it only
# ever runs from a caller, and `appId` in that section is required rather than
# inherited (CU18; the full reasoning is in common/assert-no-crash.yaml). The
# value is inert for a subflow -- the calling flow's config governs -- and no
# `tags:` are set, so this file is never collected as a top-level flow.
appId: com.thefitbud.mobile.staging
---
- extendedWaitUntil:
    visible: "Sign in with a code instead"
    timeout: 30000
- tapOn: "you@example.com or 9876543210"
- inputText: ${SIGN_IN_EMAIL}
- tapOn: "Your password"
- inputText: ${QA_PASSWORD}
# Dismiss the keyboard by tapping inert text: the sign-in sheet is a ScrollView
# with keyboardShouldPersistTaps="handled", so this works on iOS and Android.
# Maestro's hideKeyboard cannot dismiss the iOS keyboard here (Z5-5, #241).
- tapOn: "Your coach's plan for today is waiting\\."
# "Sign in" is also the screen title; the button is the one under "Forgot password?".
- tapOn:
    text: "Sign in"
    below: "Forgot password\\?"
- extendedWaitUntil:
    visible: "Today's workout|Needs you|Choose mode"
    timeout: 30000
