# Shared Maestro subflow: fail if the app has crashed or is showing an error.
#
# Usage (QT3 calls this after every screenshot step):
#   - runFlow: ../common/assert-no-crash.yaml
#
# Inputs: none. It takes no screenshot and does not launch the app.
# Asserts NOT visible (all substrings, case-insensitive regex):
#   - Expo dev client / Metro:  "There was a problem loading the project",
#     "Unable to load script"
#   - React Native red box / Android view creation (the AB2 crash):
#     "Invalid accessibility role value", "Render Error",
#     "Error while updating property"
#   - Expo dev-client error header: "Something went wrong"
#   - FitBud's own error screen (apps/mobile/src/navigation/AppRouter.tsx):
#     title "Something went wrong", subtitle "We could not load your coaching account."
# A release-style (preview) build shows no red box, so the caller must also
# assert a screen-specific anchor with assertVisible (QT3's job).
# Maestro parses every file reached by `runFlow:` as a flow in its own right
# (YamlCommandReader.readCommands -> MaestroFlowParser.parseFlow), so a subflow
# needs a config section and the `---` separator even though it never runs on its
# own. Without them the whole Android suite failed before a single flow started:
# "Config Section Required at .../common/assert-no-crash.yaml:18:1" (CU18, run
# 41643989194). `appId` is not optional in that config section and is not
# inherited from the caller: MaestroFlowParser's YamlConfig rejects a config with
# neither `appId` nor `url` ("missing_app_target"), and it throws while parsing,
# before any caller is known. So this names the application id the suite targets.
# All 18 appId values under .maestro/ are this one, which makes the choice
# behaviourally moot: whether Maestro treats a subflow's appId as inert (reading
# Orchestra, runSubFlow executes a subflow's commands under the CALLING flow's
# config, and the subflow's own configuration command is a no-op) or applies it,
# the result is the same. The app does have a second variant,
# com.thefitbud.mobile (apps/mobile/app.config.js), which this suite does not
# target; a flow for it would set its own appId, as every flow already does.
# No `tags:` here, deliberately: a tagged file can be collected as a top-level
# flow by `maestro test --include-tags`, which would run these bare assertions
# with no app launched. config.yaml already limits collection to `flows/**`, and
# an untagged file is filtered out of a tagged run regardless.
appId: com.thefitbud.mobile.staging
---
- assertNotVisible: ".*There was a problem loading the project.*"
- assertNotVisible: ".*Unable to load script.*"
- assertNotVisible: ".*Invalid accessibility role value.*"
- assertNotVisible: ".*Render Error.*"
- assertNotVisible: ".*Error while updating property.*"
- assertNotVisible: ".*Something went wrong.*"
- assertNotVisible: ".*We could not load your coaching account.*"
