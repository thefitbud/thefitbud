# Subflow: trainee Today is loaded and usable after sign-in (FitBud #485 / #502).
# A check-in review banner can cover the header; Z12-46 puts the workout card
# below This week / From your coach. Drain the banner, then require an
# above-the-fold home marker. Prefer today-summary / trainee-today testIDs
# (date-independent). Rest day / Recovery / View summary / preparing plan cover
# days when the srOnly "Today's workout" label is missing on Android.
appId: com.thefitbud.mobile.staging
---
- extendedWaitUntil:
    notVisible: ".*Loading your day.*"
    timeout: 30000
- runFlow:
    when:
      visible: ".*reviewed your check-in.*"
    commands:
      - extendedWaitUntil:
          notVisible: ".*reviewed your check-in.*"
          timeout: 15000
- extendedWaitUntil:
    visible:
      id: "today-summary"
    timeout: 5000
    optional: true
- extendedWaitUntil:
    visible:
      id: "trainee-today"
    timeout: 3000
    optional: true
- extendedWaitUntil:
    visible: "This week|Today's workout.*|View summary|Rest day|Recovery is part of the plan|preparing your plan"
    timeout: 30000
