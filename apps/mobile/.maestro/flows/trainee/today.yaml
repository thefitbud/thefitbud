appId: com.thefitbud.mobile.staging
name: Trainee Today
tags:
  - trainee
  - smoke
  - full
---
# Today for the on-track trainee (QA Aarav).
#
# Env from the runner: QA_ONTRACK_EMAIL, QA_PASSWORD.
# Optional env, from the run's own apps/api/.qa-seed/expectations.json (these
# are dated, so they change every night and must never be written in this file):
#   QA_TODAY_WORKOUT_NAME  accounts[ontrack].today.workoutName; unset or empty on
#                          a rest day (the QA plan trains four days a week)
#   QA_TODAY_MEAL_NAME     accounts[ontrack].today.mealNames[0]
# Without them the flow checks the structure only.
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- runFlow:
    file: ../../common/sign-in-password.yaml
    env:
      SIGN_IN_EMAIL: ${QA_ONTRACK_EMAIL}
- extendedWaitUntil:
    notVisible: ".*Loading your day.*"
    timeout: 30000
# Plan-gated wait, then the pair (CU22, D-W3b-24).
#
# Two separate loads feed this screen and only one of them is covered by the
# wait above. `Loading your day...` clearing means the DAY load settled (six
# parallel requests). The plan load is a different path: it awaits a full sync
# pull, up to 50 serial SQLite writes, before it fetches the plan. So on a
# cold emulator (`clearState: true`) the day can be on screen while the plan
# is still loading, and `assertVisible` only retries for Maestro's short
# default.
#
# The workout section is now gated on the plan, so it is both the thing worth
# asserting and the right thing to WAIT on: a generous wait here is strictly
# stronger than an assertion, because it still fails if the plan resolves to
# "no plan published" rather than to a live version.
#
# Why this element and not "Here's your day." or "Nutrition":
# - "Here's your day." is the greeting subtitle, which switches to
#   "Nicely done." when every item for the day is already logged. The QA seed
#   does NOT rule that out: `loggedMealsTodayOnTrack` is a minimum of one, and
#   logged rows exist only for meals whose time has passed, so a hand-dispatched
#   seed-reset late in the IST day on a rest day of the generated plan would
#   make it read "Nicely done." on a correct build.
# - "Nutrition" is plan-gated and not affected by that, but it sits below the
#   fold (this flow scrolls to it further down), so waiting on it would risk
#   failing a correct build for a reason that has nothing to do with the plan.
# - "Today's workout" is plan-gated, unaffected by what is logged, and is on
#   screen without scrolling (run 41787562558 asserted it directly).
- extendedWaitUntil:
    visible: "Today's workout"
    timeout: 60000
# The pair: exactly one of these two states renders, and "loaded" and
# "none" are mutually exclusive, so the two lines together pin the plan state.
- assertNotVisible: ".*is preparing your plan.*"
- takeScreenshot: trainee-today__loaded
- runFlow: ../../common/assert-no-crash.yaml

# A workout card with an exercise count, or the rest-day card. Both are valid.
- assertVisible: 'Rest day\. Recovery is part of the plan\.|[0-9]+ exercises?.*'
- runFlow:
    when:
      true: ${typeof QA_TODAY_WORKOUT_NAME !== 'undefined' && QA_TODAY_WORKOUT_NAME !== ''}
    commands:
      - assertVisible: ".*${QA_TODAY_WORKOUT_NAME}.*"

# Nutrition and the planned meals sit below the workout card.
# 120 s, not 20 s: on iOS each step on this screen takes about ten times as long
# as on Android (the flow ran 12m 53s before failing on iOS, 1m 21s on Android),
# so 20 s left time for about one look-and-swipe (Z5-5b, cause 11, job
# 127261380352). A longer limit only lets the scroll continue; Android still
# stops as soon as the element is on screen.
- scrollUntilVisible:
    element: "Nutrition"
    timeout: 120000
- scrollUntilVisible:
    element: "Meals"
    timeout: 120000
- assertNotVisible: "No meals planned today\\."
- runFlow:
    when:
      true: ${typeof QA_TODAY_MEAL_NAME !== 'undefined' && QA_TODAY_MEAL_NAME !== ''}
    commands:
      - scrollUntilVisible:
          element: ".*${QA_TODAY_MEAL_NAME}.*"
          timeout: 120000
- runFlow: ../../common/assert-no-crash.yaml
