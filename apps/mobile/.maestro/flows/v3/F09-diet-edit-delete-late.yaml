appId: com.thefitbud.mobile.staging
name: F09 Diet edit and late log (Z12-42)
tags:
  - device
  - trainee
  - z12-42
---
# F09 (Z12-42): changing and late-logging a meal on Diet. A due meal opens the
# "Something different" sheet and closing it logs nothing; a closed meal on a
# past day offers no Change. Z14-13b (D-W14-22) adds the 24 hour edit: Edit on
# the just-logged card opens "Change this log" or the prefilled screen, nothing
# is saved; a past entry opens its sheet with the lock note and "Ask {coach}
# to fix it". Remove is walked only up to its confirm and kept, so the account
# is left as it was.
#
# Account: the on-track trainee, aarav.ontrack (Asia/Kolkata). Env from the
# device harness: QA_ONTRACK_EMAIL, QA_PASSWORD. Nothing is saved.
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- runFlow:
    file: ../../common/sign-in-password.yaml
    env:
      SIGN_IN_EMAIL: ${QA_ONTRACK_EMAIL}
- extendedWaitUntil:
    notVisible: ".*Loading your day.*"
    timeout: 30000
- extendedWaitUntil:
    visible: "Today's workout.*|Rest day|Recovery is part of the plan|This week"
    timeout: 60000
- tapOn: "Diet"
- extendedWaitUntil:
    visible: ".*kcal eaten.*"
    timeout: 30000
# The meal's window is clock-relative, so the sheet is opened only when the
# screen offers it.
- runFlow:
    when:
      visible: "Something different"
    commands:
      - tapOn: "Something different"
      - extendedWaitUntil:
          visible: "Log it myself"
          timeout: 30000
      - runFlow: ../../common/assert-no-crash.yaml
      - tapOn: "Back"
      - extendedWaitUntil:
          visible: ".*kcal eaten.*"
          timeout: 10000
- assertNotVisible: ".*Waiting to send.*"

# ---- Z14-13b: edit a logged entry for 24 hours -----------------------------------
# Only when the account has a just-logged meal inside its window (the server's
# `editableUntil`); the screen shows "Editable until ..." under Edit then.
- runFlow:
    when:
      visible: "Editable until .*"
    commands:
      - tapOn: "Edit"
      - extendedWaitUntil:
          visible: "Change this log|Edit portion|Edit ate out"
          timeout: 15000
      - takeScreenshot: f09-diet-edit
      - runFlow: ../../common/assert-no-crash.yaml
      - tapOn: "Back"
      - extendedWaitUntil:
          visible: ".*kcal eaten.*"
          timeout: 10000
- assertNotVisible: ".*Waiting to send.*"

# ---- A closed meal on a past day has no Change ---------------------------------
- evalScript: ${output.yesterday = (function () { var d = new Date(Date.now() + (5.5 * 3600 - 86400) * 1000); return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()]; })()}
- runFlow:
    when:
      notVisible: "${output.yesterday}, .*"
    commands:
      - tapOn: "Previous week"
- tapOn: "${output.yesterday}, .*"
- extendedWaitUntil:
    visible: ".*kcal eaten.*"
    timeout: 30000
# A closed row reads "Closed · can't be changed now" and carries no Change button.
- runFlow:
    when:
      visible: "Closed · .*"
    commands:
      - assertNotVisible: "Change"
- takeScreenshot: f09-diet-yesterday
# ---- Z14-13b: a past entry is locked ---------------------------------------------
# The logged sheet has no Edit or Remove, a neutral lock note and a way to ask
# the coach (a wa.me prefill the trainee sends, never auto-sent).
- runFlow:
    when:
      visible: ".*, logged"
    commands:
      - tapOn: ".*, logged"
      # An entry logged late yesterday can still be inside its 24 hours.
      - extendedWaitUntil:
          visible: "Logged entries can be changed for 24 hours.|Editable until .*"
          timeout: 15000
      - runFlow:
          when:
            visible: "Logged entries can be changed for 24 hours."
          commands:
            - assertVisible: "Ask .* to fix it"
            - assertNotVisible: "Remove this log"
      - takeScreenshot: f09-diet-locked
- runFlow: ../../common/assert-no-crash.yaml
