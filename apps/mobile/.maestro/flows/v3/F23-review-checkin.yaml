appId: com.thefitbud.mobile.staging
name: F23 Coach reviews a check-in (Z12-53)
tags:
  - device
  - trainer
  - z12-53
---
# F23: type a reply, Send by id, then assert checkin-reviewed (not partial
# "Reply sent|Undo|…" — Maestro matches the full string).
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- runFlow:
    file: ../../common/sign-in-password.yaml
    env:
      SIGN_IN_EMAIL: ${QA_TRAINER_EMAIL}
- runFlow: ../../common/wait-attention-loaded.yaml
- tapOn:
    id: "tab-checkins"
- extendedWaitUntil:
    visible:
      id: "checkins-loaded"
    timeout: 60000
- takeScreenshot: TM-05a
- runFlow: ../../common/assert-no-crash.yaml

- runFlow:
    when:
      visible:
        id: "checkins-segment-overdue"
    commands:
      - tapOn:
          id: "checkins-segment-overdue"
      - takeScreenshot: TM-05b
      - runFlow: ../../common/assert-no-crash.yaml
      - tapOn:
          id: "checkins-segment-to-review"

- extendedWaitUntil:
    visible:
      id: "checkin-row"
    timeout: 60000
- tapOn:
    id: "checkin-row"
- extendedWaitUntil:
    visible:
      id: "checkin-loaded"
    timeout: 60000
- takeScreenshot: TM-06a
- runFlow: ../../common/assert-no-crash.yaml

- runFlow:
    when:
      visible: ".*Reply.*"
    commands:
      - tapOn: ".*Reply.*"
      - extendedWaitUntil:
          visible:
            id: "checkin-reply-input"
          timeout: 15000
      - tapOn:
          id: "checkin-reply-input"
      - inputText: "Nice week — keep the evening walks."
      - takeScreenshot: TM-06b
      - tapOn:
          id: "checkin-reply-send"

- runFlow:
    when:
      visible: ".*Mark reviewed.*"
    commands:
      - tapOn: ".*Mark reviewed.*"
- runFlow:
    when:
      visible: ".*Save review.*|.*^Save$"
    commands:
      - tapOn: ".*Save review.*|.*^Save$"

- extendedWaitUntil:
    visible:
      id: "checkin-reviewed"
    timeout: 20000
- assertVisible: ".*Your reply.*|.*Reviewed.*"
- takeScreenshot: TM-06c
- runFlow: ../../common/assert-no-crash.yaml

- runFlow:
    when:
      visible:
        id: "checkins-segment-reviewed"
    commands:
      - tapOn:
          id: "checkins-segment-reviewed"
      - takeScreenshot: TM-05e
      - runFlow: ../../common/assert-no-crash.yaml
