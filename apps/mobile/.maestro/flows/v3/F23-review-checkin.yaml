appId: com.thefitbud.mobile.staging
name: F23 Coach reviews a check-in (Z12-53)
tags:
  - device
  - trainer
  - z12-53
---
# F23 (Z12-53): Check-ins inbox → open row → reply (type text) → Send by id →
# mark reviewed. Device run 44898344946: composer opened but Send stayed disabled
# because the flow never typed.
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- runFlow:
    file: ../../common/sign-in-password.yaml
    env:
      SIGN_IN_EMAIL: ${QA_TRAINER_EMAIL}
- runFlow: ../../common/wait-attention-loaded.yaml
- tapOn:
    id: "tab-checkins"
- extendedWaitUntil:
    visible:
      id: "checkins-screen"
    timeout: 30000
- assertVisible: "Check-ins"
- takeScreenshot: TM-05a
- runFlow: ../../common/assert-no-crash.yaml

- runFlow:
    when:
      visible:
        id: "checkins-segment-overdue"
    commands:
      - tapOn:
          id: "checkins-segment-overdue"
      - takeScreenshot: TM-05b
      - runFlow: ../../common/assert-no-crash.yaml
      - tapOn:
          id: "checkins-segment-to-review"

- extendedWaitUntil:
    visible:
      id: "checkin-row"
    timeout: 60000
- tapOn:
    id: "checkin-row"
- extendedWaitUntil:
    visible: "Mark reviewed|Reply|Save|This week|Last week"
    timeout: 30000
- takeScreenshot: TM-06a
- runFlow: ../../common/assert-no-crash.yaml

- runFlow:
    when:
      visible: "Reply"
    commands:
      - tapOn: "Reply"
      - extendedWaitUntil:
          visible:
            id: "checkin-reply-input"
          timeout: 15000
      - tapOn:
          id: "checkin-reply-input"
      - inputText: "Nice week — keep the evening walks."
      - takeScreenshot: TM-06b
      - tapOn:
          id: "checkin-reply-send"
      - extendedWaitUntil:
          visible: "Reply sent|Undo|Mark reviewed|Check-ins"
          timeout: 20000

- runFlow:
    when:
      visible: "Mark reviewed"
    commands:
      - tapOn: "Mark reviewed"
- runFlow:
    when:
      visible: "Save review|Save"
    commands:
      - tapOn: "Save review|Save"

- extendedWaitUntil:
    visible: "Undo|Check-ins|Reviewed|Reply sent"
    timeout: 15000
- takeScreenshot: TM-06c
- runFlow: ../../common/assert-no-crash.yaml

- runFlow:
    when:
      visible:
        id: "checkins-segment-reviewed"
    commands:
      - tapOn:
          id: "checkins-segment-reviewed"
      - takeScreenshot: TM-05e
      - runFlow: ../../common/assert-no-crash.yaml
