appId: com.thefitbud.mobile.staging
name: F16 Ended coaching and the coach's restart request (Z12-49)
tags:
  - device
  - trainee
  - z12-49
env:
  # Public demo accounts on the local seed (same demo password as the others).
  ENDED_EMAIL: kavya.ended@demo.fitbud.test
  REACTIVATE_EMAIL: nikhil.reactivate@demo.fitbud.test
---
# F16 (Z12-49): an ended trainee (Kavya) lands on the ended Today content
# (TR-22a): the end date, the history card and "New coach?". Past coaching
# opens and closes; the invite-code sheet opens. Nikhil's coach asked to
# restart: the TR-22b sheet asks; Not now keeps coaching ended.
# Session expiry (TR-24) and the generic error (TR-21) need a refused refresh
# or a failing API, which a flow cannot cause on the runner: Expo web and unit
# tests. Env: QA_PASSWORD.
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Sign in with a code instead"
    timeout: 60000
- tapOn: "you@example.com or 9876543210"
- inputText: ${ENDED_EMAIL}
# Retype when the field lost keystrokes. On a cold first launch the Android
# emulator dropped the first letter ("aarav.ontrack@..." arrived as
# "arav.ontrack@...", device runs 44191354664 and 44200084620, light launch
# smoke), so the API answered INVALID_CREDENTIALS and TR-01e showed. The
# field keeps focus: erase and type again (as z12-36/sign-in-password.yaml).
- runFlow:
    when:
      notVisible: "${ENDED_EMAIL}.*"
    commands:
      - eraseText: 60
      - inputText: ${ENDED_EMAIL}
- tapOn: "Your password"
- inputText: ${QA_PASSWORD}
- tapOn: "Use the mobile number or email your coach invited\\."
- tapOn:
    text: "Sign in"
    below: "Forgot password\\??"

# TR-22a
- extendedWaitUntil:
    visible: "Your history is safe"
    timeout: 60000
- assertVisible: "Coaching with .* ended.*"
- assertVisible: "New coach\\?"
- takeScreenshot: TR-22a
- runFlow: ../../common/assert-no-crash.yaml
- tapOn: "View past coaching"
- extendedWaitUntil:
    visible: "Back"
    timeout: 20000
- takeScreenshot: z12-49-past-coaching
- tapOn: "Back"
- extendedWaitUntil:
    visible: "Your history is safe"
    timeout: 20000
- tapOn: "Enter code"
- extendedWaitUntil:
    visible: "Use this code"
    timeout: 10000
- takeScreenshot: z12-49-ended-code
- tapOn: "Dismiss sheet"
- extendedWaitUntil:
    notVisible: "Use this code"
    timeout: 10000
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Sign in with a code instead"
    timeout: 20000

# TR-22b
- tapOn: "you@example.com or 9876543210"
- inputText: ${REACTIVATE_EMAIL}
# Retype when the field lost keystrokes (see the first sign-in above).
- runFlow:
    when:
      notVisible: "${REACTIVATE_EMAIL}.*"
    commands:
      - eraseText: 60
      - inputText: ${REACTIVATE_EMAIL}
- tapOn: "Your password"
- inputText: ${QA_PASSWORD}
- tapOn: "Use the mobile number or email your coach invited\\."
- tapOn:
    text: "Sign in"
    below: "Forgot password\\??"
- extendedWaitUntil:
    visible: ".* wants to coach you again"
    timeout: 60000
- assertVisible: "Restart with .*"
- takeScreenshot: TR-22b
- runFlow: ../../common/assert-no-crash.yaml
- tapOn: "Not now"
- extendedWaitUntil:
    notVisible: ".* wants to coach you again"
    timeout: 10000
- assertVisible: "Your history is safe"
- runFlow: ../../common/assert-no-crash.yaml
