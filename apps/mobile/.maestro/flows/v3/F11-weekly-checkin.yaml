appId: com.thefitbud.mobile.staging
name: F11 Weekly check-in, sent, and a reviewed one (Z12-46)
tags:
  - device
  - trainee
  - z12-46
---
# F11 (Z12-46): the weekly check-in from Today, through the form and review to Sent
# (TR-14d), then a reviewed check-in from Progress (TR-14g, read-only).
#
# Account: Meera (`meera.ack`, local demo seed, password from QA_PASSWORD). Her
# check-in dated today is a draft the trainee can start (the seed makes one per
# demo day; her form requires the "Wellbeing" line, filled where it shows), and her
# 8 Nov check-in is reviewed. ASSERTED, not skipped: a seed
# without them fails here. Writes one submitted check-in to the local DB.
#
# Screens and screenshots (named by v3 screen ID):
#   TR-14a  the form, step 1      TR-14c  the review step
#   TR-14d  Sent                  TR-14g  a reviewed check-in
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- runFlow:
    file: ../../common/sign-in-password.yaml
    env:
      SIGN_IN_EMAIL: meera.ack@demo.fitbud.test
- extendedWaitUntil:
    notVisible: ".*Loading your day.*"
    timeout: 30000
- extendedWaitUntil:
    notVisible: ".*Checking for a due check-in.*"
    timeout: 30000
# The check-in card sits low on Today. Its error state would say "CHK-"; it must not.
# The device run seeds once and runs both themes, so the second theme finds the
# check-in the first one sent: that state is asserted (the card now reads "Next
# check-in <day>"), and TR-14a, 14c and 14d come from the first theme only.
- assertNotVisible: ".*CHK-.*"
- scrollUntilVisible:
    element: "Start|Next check-in.*"
    timeout: 30000
- runFlow:
    when:
      visible: "Start"
    commands:
      - tapOn: "Start"
      - extendedWaitUntil:
          visible: "Weekly check-in"
          timeout: 20000
      - assertVisible: ".*step 1 of 3.*"
      - takeScreenshot: TR-14a-checkin-questions
      - runFlow: ../../common/assert-no-crash.yaml
      - evalScript: ${output.filled = 'no'}
      - runFlow:
          when:
            true: ${output.filled == 'no'}
            visible: "Wellbeing"
          commands:
            - tapOn: "Wellbeing"
            - inputText: "Good week, one session missed."
            - tapOn: "Weekly check-in"
            - evalScript: ${output.filled = 'yes'}
      - tapOn: "Continue"
      - assertVisible: ".*step 2 of 3.*"
      - runFlow:
          when:
            true: ${output.filled == 'no'}
            visible: "Wellbeing"
          commands:
            - tapOn: "Wellbeing"
            - inputText: "Good week, one session missed."
            - tapOn: "Weekly check-in"
            - evalScript: ${output.filled = 'yes'}
      - tapOn: "Continue"
      - assertVisible: ".*step 3 of 3.*"
      - runFlow:
          when:
            true: ${output.filled == 'no'}
            visible: "Wellbeing"
          commands:
            - tapOn: "Wellbeing"
            - inputText: "Good week, one session missed."
            - tapOn: "Weekly check-in"
            - evalScript: ${output.filled = 'yes'}
      - tapOn: "Continue"
      - extendedWaitUntil:
          visible: "Send to .*"
          timeout: 10000
      - takeScreenshot: TR-14c-checkin-review
      # "Send to Rahul" is also the Review subtitle: the button is the second match.
      - tapOn:
          text: "Send to .*"
          index: 1
      # TR-14d: Sent, with Done. A cold iOS simulator can take over a minute to send.
      - extendedWaitUntil:
          visible: "Sent to .*"
          timeout: 120000
      - assertVisible: "Done"
      - takeScreenshot: TR-14d-checkin-sent
      - runFlow: ../../common/assert-no-crash.yaml
      - tapOn: "Done"
- runFlow:
    when:
      visible: "Next check-in.*"
    commands:
      - takeScreenshot: TR-14-card-next-checkin

# TR-14g: a reviewed check-in opens read-only, with the coach's reply.
- tapOn: "Progress"
- scrollUntilVisible:
    element: "Sun 8 Nov.*"
    timeout: 30000
# The row can stop under the floating tab bar (iOS), where a tap lands on Diet: lift it.
- scroll
- tapOn: "Sun 8 Nov.*"
- extendedWaitUntil:
    visible: "Your answers"
    timeout: 30000
- assertNotVisible: "Continue"
- assertNotVisible: "Send to .*"
- takeScreenshot: TR-14g-checkin-reviewed
- runFlow: ../../common/assert-no-crash.yaml
