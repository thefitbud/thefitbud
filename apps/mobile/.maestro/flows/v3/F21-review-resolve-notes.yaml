appId: com.thefitbud.mobile.staging
name: F21 Trainer marks reviewed, resolves and adds a note (Z12-51)
tags:
  - device
  - trainer
  - z12-51
env:
  CLIENT: Rohan Mehta
  CLIENT_SLUG: rohan-mehta
---
# F21 (Z12-51). Resolve appears after Mark reviewed (TM-04e), not on TM-04a.
# ⋯ opens MoreSheet (BottomSheet) → more-profile / more-add-note by id.
# Maestro text is FULL-string regex — never assert bare substrings.
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- runFlow:
    file: ../../common/sign-in-password.yaml
    env:
      SIGN_IN_EMAIL: ${QA_TRAINER_EMAIL}
- runFlow: ../../common/wait-attention-loaded.yaml

- tapOn:
    id: "tab-clients"
- scrollUntilVisible:
    element:
      id: "client-row-${CLIENT_SLUG}"
    timeout: 60000
- tapOn:
    id: "client-row-${CLIENT_SLUG}"
- extendedWaitUntil:
    visible:
      id: "client-review-exception"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        id: "client-review-exception"
    commands:
      - tapOn:
          id: "client-review-exception"
- extendedWaitUntil:
    visible:
      id: "exception-more"
    timeout: 30000
- runFlow: ../../common/assert-no-crash.yaml
- runFlow:
    when:
      visible:
        id: "exception-markReviewed"
    commands:
      - takeScreenshot: TM-04a

- tapOn:
    id: "exception-more"
- extendedWaitUntil:
    visible:
      id: "more-sheet"
    timeout: 15000
- assertVisible:
    id: "more-profile"
- assertVisible:
    id: "more-whatsapp"
- assertVisible:
    id: "more-add-note"
- takeScreenshot: TM-04j
- tapOn:
    id: "more-add-note"
- extendedWaitUntil:
    visible: ".*Note for .*"
    timeout: 10000
- inputText: "Two shorter sessions this week."
- assertVisible: ".*Show on .*Today.*"
- takeScreenshot: TM-04k
- tapOn:
    id: "note-save"
- extendedWaitUntil:
    notVisible: ".*Note for .*"
    timeout: 15000
- runFlow: ../../common/assert-no-crash.yaml

- runFlow:
    when:
      visible:
        id: "exception-markReviewed"
    commands:
      - tapOn:
          id: "exception-markReviewed"
- extendedWaitUntil:
    visible:
      id: "exception-resolve"
    timeout: 20000
- assertNotVisible:
    id: "exception-markReviewed"
- takeScreenshot: TM-04e
- runFlow: ../../common/assert-no-crash.yaml

- tapOn:
    id: "exception-resolve"
- extendedWaitUntil:
    visible: ".*Note \\(only you\\).*"
    timeout: 10000
- tapOn: ".*Talked to .*"
- assertVisible: ".*Resolving locks this item.*"
- takeScreenshot: TM-04d
- tapOn:
    id: "resolve-confirm"
- extendedWaitUntil:
    visible: ".*Resolved by you.*Talked to .*"
    timeout: 20000
- assertNotVisible:
    id: "exception-resolve"
- assertNotVisible:
    id: "exception-more"
- takeScreenshot: TM-04f
- runFlow: ../../common/assert-no-crash.yaml

- tapOn:
    id: "exception-back"
- extendedWaitUntil:
    notVisible:
      id: "exception-back"
    timeout: 20000
- launchApp:
    stopApp: true
    permissions:
      all: allow
- runFlow: ../../common/wait-attention-loaded.yaml
- scrollUntilVisible:
    element:
      id: "needs-you-action"
    direction: DOWN
    timeout: 60000
- tapOn: ".*Review ${CLIENT}.*"
- extendedWaitUntil:
    visible:
      id: "review-sheet-resolve"
    timeout: 8000
    optional: true
- extendedWaitUntil:
    visible:
      id: "exception-review"
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible:
        id: "review-sheet-resolve"
    commands:
      - assertVisible:
          id: "review-sheet-more"
      - takeScreenshot: review-sheet
      - runFlow: ../../common/assert-no-crash.yaml
      - runFlow:
          when:
            visible:
              id: "review-sheet-nudge"
          commands:
            - tapOn:
                id: "review-sheet-nudge"
            - extendedWaitUntil:
                visible: ".*PREVIEW.*"
                timeout: 20000
            - takeScreenshot: review-sheet-nudge
            - tapOn: ".*Close.*"
            - extendedWaitUntil:
                notVisible: ".*PREVIEW.*"
                timeout: 10000
      - tapOn:
          id: "review-sheet-resolve"
      - extendedWaitUntil:
          visible: ".*Note \\(only you\\).*"
          timeout: 10000
      - tapOn:
          id: "resolve-confirm"
      - extendedWaitUntil:
          visible: ".*Resolved by you.*"
          timeout: 20000
      - takeScreenshot: review-sheet-resolved
      - runFlow: ../../common/assert-no-crash.yaml
- runFlow:
    when:
      visible:
        id: "exception-markReviewed"
    commands:
      - tapOn:
          id: "exception-markReviewed"
      - extendedWaitUntil:
          visible:
            id: "exception-resolve"
          timeout: 20000
      - tapOn:
          id: "exception-resolve"
      - extendedWaitUntil:
          visible: ".*Note \\(only you\\).*"
          timeout: 10000
      - tapOn:
          id: "resolve-confirm"
      - takeScreenshot: review-sheet-resolved
      - runFlow: ../../common/assert-no-crash.yaml
- runFlow:
    when:
      visible:
        id: "exception-resolve"
    commands:
      - tapOn:
          id: "exception-resolve"
      - extendedWaitUntil:
          visible: ".*Note \\(only you\\).*"
          timeout: 10000
      - tapOn:
          id: "resolve-confirm"
      - takeScreenshot: review-sheet-resolved
      - runFlow: ../../common/assert-no-crash.yaml
