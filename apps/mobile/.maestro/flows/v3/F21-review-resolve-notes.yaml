appId: com.thefitbud.mobile.staging
name: F21 Trainer marks reviewed, resolves and adds a note (Z12-51)
tags:
  - device
  - trainer
  - z12-51
env:
  CLIENT: Rohan Mehta
  CLIENT_SLUG: rohan-mehta
---
# F21 (Z12-51). Demo trainer on the local seed. Env: QA_TRAINER_EMAIL, QA_PASSWORD,
# DEVICE_THEME.
#
# Resolve finding (device run 44898344946): NOT a product regression. TM-04a open
# item (Z14-23, D-W14-29) shows Remind, Noted keep open and Resolve… with Add note
# and WhatsApp as text actions; there is no ⋯ menu. Noted keep open shows the
# state line with Undo and the item stays open. Assert by testID.
#
# Screens: TM-04a, TM-04j, TM-04k, TM-04e, TM-04d, TM-04f; then Needs you
# review-sheet-* when Rohan still has open items.
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- runFlow:
    file: ../../common/sign-in-password.yaml
    env:
      SIGN_IN_EMAIL: ${QA_TRAINER_EMAIL}
- runFlow: ../../common/wait-attention-loaded.yaml

- tapOn:
    id: "tab-clients"
- scrollUntilVisible:
    element:
      id: "client-row-${CLIENT_SLUG}"
    timeout: 60000
- tapOn:
    id: "client-row-${CLIENT_SLUG}"
- extendedWaitUntil:
    visible:
      id: "client-review-exception"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        id: "client-review-exception"
    commands:
      - tapOn:
          id: "client-review-exception"
- extendedWaitUntil:
    visible:
      id: "exception-review"
    timeout: 30000
- runFlow: ../../common/assert-no-crash.yaml
- runFlow:
    when:
      visible:
        id: "exception-noted"
    commands:
      - takeScreenshot: TM-04a

- assertVisible:
    id: "exception-whatsapp"
- assertVisible:
    id: "exception-add-note"
- assertNotVisible:
    id: "exception-more"
- takeScreenshot: TM-04j
- tapOn:
    id: "exception-add-note"
- extendedWaitUntil:
    visible: "Note for .*"
    timeout: 10000
- inputText: "Two shorter sessions this week."
- assertVisible: "Only me"
- takeScreenshot: TM-04k
- tapOn:
    id: "note-save"
- extendedWaitUntil:
    notVisible: "Note for .*"
    timeout: 15000
- runFlow: ../../common/assert-no-crash.yaml

- runFlow:
    when:
      visible:
        id: "exception-noted"
    commands:
      - tapOn:
          id: "exception-noted"
- extendedWaitUntil:
    visible:
      id: "exception-resolve"
    timeout: 20000
- assertNotVisible:
    id: "exception-noted"
- takeScreenshot: TM-04e
- runFlow: ../../common/assert-no-crash.yaml

- tapOn:
    id: "exception-resolve"
- extendedWaitUntil:
    visible: "Note \\(only you\\)"
    timeout: 10000
- tapOn: "Talked to .*"
- assertVisible: "Resolving locks this item.*"
- takeScreenshot: TM-04d
- tapOn:
    id: "resolve-confirm"
- extendedWaitUntil:
    visible: "Resolved by you.*Talked to .*"
    timeout: 20000
- assertNotVisible:
    id: "exception-resolve"
- assertNotVisible:
    id: "exception-add-note"
- takeScreenshot: TM-04f
- runFlow: ../../common/assert-no-crash.yaml

# Needs you: open Rohan's Review (needs-you-action) → multi-item review sheet.
- tapOn:
    id: "exception-back"
- extendedWaitUntil:
    notVisible:
      id: "exception-back"
    timeout: 20000
- launchApp:
    stopApp: true
    permissions:
      all: allow
- runFlow: ../../common/wait-attention-loaded.yaml
- scrollUntilVisible:
    element:
      id: "needs-you-action"
    direction: DOWN
    timeout: 60000
- tapOn: "Review ${CLIENT}|Review Rohan.*"
- extendedWaitUntil:
    visible:
      id: "review-sheet-resolve"
    timeout: 8000
    optional: true
- extendedWaitUntil:
    visible:
      id: "exception-review"
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible:
        id: "review-sheet-resolve"
    commands:
      - assertVisible:
          id: "review-sheet-add-note"
      - takeScreenshot: review-sheet
      - runFlow: ../../common/assert-no-crash.yaml
      - runFlow:
          when:
            visible:
              id: "review-sheet-remind"
          commands:
            - tapOn:
                id: "review-sheet-remind"
            - extendedWaitUntil:
                visible: "PREVIEW · TAP TO EDIT"
                timeout: 20000
            - takeScreenshot: review-sheet-remind
            - tapOn: "Close"
            - extendedWaitUntil:
                notVisible: "PREVIEW · TAP TO EDIT"
                timeout: 10000
      - tapOn:
          id: "review-sheet-resolve"
      - extendedWaitUntil:
          visible: "Note \\(only you\\)"
          timeout: 10000
      - tapOn:
          id: "resolve-confirm"
      - extendedWaitUntil:
          visible: "Resolved by you · just now.*"
          timeout: 20000
      - takeScreenshot: review-sheet-resolved
      - runFlow: ../../common/assert-no-crash.yaml
- runFlow:
    when:
      visible:
        id: "exception-noted"
    commands:
      - tapOn:
          id: "exception-noted"
      - extendedWaitUntil:
          visible:
            id: "exception-resolve"
          timeout: 20000
      - tapOn:
          id: "exception-resolve"
      - extendedWaitUntil:
          visible: "Note \\(only you\\)"
          timeout: 10000
      - tapOn:
          id: "resolve-confirm"
      - takeScreenshot: review-sheet-resolved
      - runFlow: ../../common/assert-no-crash.yaml
- runFlow:
    when:
      visible:
        id: "exception-resolve"
    commands:
      - tapOn:
          id: "exception-resolve"
      - extendedWaitUntil:
          visible: "Note \\(only you\\)"
          timeout: 10000
      - tapOn:
          id: "resolve-confirm"
      - takeScreenshot: review-sheet-resolved
      - runFlow: ../../common/assert-no-crash.yaml
