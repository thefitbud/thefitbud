appId: com.thefitbud.mobile.staging
name: F20 Trainer nudges a client as a FitBud push (Z12-50)
tags:
  - device
  - trainer
  - z12-50
env:
  # Slug for client-row-* testIDs (ClientsTab). Must match the seeded display name.
  CLIENT_SLUG: rohan-mehta
---
# F20 (D-W12-9, D-W12-10, D-W12-22, Z12-50 part 2). Account: the demo trainer rahul.coach
# on the local seed. Env from the device harness: QA_TRAINER_EMAIL, QA_PASSWORD,
# DEVICE_THEME. One local DB per job and one nudge per item per client day, so only the
# first theme of a job really sends (TM-04m); the second shows TM-04n at once. A repeat
# about the same item is then sent again to show the TM-04n state in both.
#
# Screens: TM-03j, TM-04b/c, TM-04m/n, TM-04o. Selectors are testIDs (v3 client detail
# has Review on the Needs attention card, not Mark reviewed/Resolve).
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- runFlow:
    file: ../../common/sign-in-password.yaml
    env:
      SIGN_IN_EMAIL: ${QA_TRAINER_EMAIL}
- runFlow: ../../common/wait-attention-loaded.yaml
- runFlow:
    file: ../../device/z12-50/nudge-client.yaml
    env:
      CLIENT: Rohan Mehta
      CLIENT_SLUG: rohan-mehta
- runFlow: ../../device/z12-50/open-sheet.yaml
- takeScreenshot: TM-04b
- runFlow:
    when:
      visible: "It's .* inside their quiet hours.*"
    commands:
      - takeScreenshot: TM-04c
- runFlow: ../../common/assert-no-crash.yaml
- tapOn: "Send nudge"
- extendedWaitUntil:
    visible: "Nudge sent.*"
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible: "Nudge sent.*"
    commands:
      - takeScreenshot: TM-04m
- extendedWaitUntil:
    visible: "You nudged .* again tomorrow.*"
    timeout: 6000
    optional: true
- runFlow:
    when:
      visible: "You nudged .* again tomorrow.*"
    commands:
      - takeScreenshot: TM-04n
      - tapOn: "Close"
- extendedWaitUntil:
    notVisible: "PREVIEW · TAP TO EDIT"
    timeout: 20000
- runFlow: ../../common/assert-no-crash.yaml

- extendedWaitUntil:
    notVisible: "Nudge sent.*"
    timeout: 15000
- runFlow: ../../device/z12-50/to-nudge.yaml
- runFlow: ../../device/z12-50/open-sheet.yaml
- tapOn: "Send nudge"
- extendedWaitUntil:
    visible: "You nudged .* again tomorrow.*"
    timeout: 20000
- takeScreenshot: TM-04n
- runFlow: ../../common/assert-no-crash.yaml
- tapOn: "Close"
- extendedWaitUntil:
    notVisible: "PREVIEW · TAP TO EDIT"
    timeout: 10000

- runFlow:
    file: ../../device/z12-50/nudge-client.yaml
    env:
      CLIENT: Ishita Banerjee
      CLIENT_SLUG: ishita-banerjee
- runFlow: ../../device/z12-50/open-sheet.yaml
- extendedWaitUntil:
    visible: ".*has turned off FitBud notifications.*"
    timeout: 20000
- takeScreenshot: TM-04o
- runFlow: ../../common/assert-no-crash.yaml
- tapOn: "Send nudge"
- extendedWaitUntil:
    notVisible: "PREVIEW · TAP TO EDIT"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: "PREVIEW · TAP TO EDIT"
    commands:
      - tapOn: "Close"
- runFlow: ../../common/assert-no-crash.yaml
