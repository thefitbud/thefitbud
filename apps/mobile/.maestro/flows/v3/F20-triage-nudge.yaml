appId: com.thefitbud.mobile.staging
name: F20 Trainer nudges a client as a FitBud push (Z12-50)
tags:
  - device
  - trainer
  - z12-50
env:
  CLIENT_SLUG: rohan-mehta
---
# F20. Selectors are full-match or ids (nudge-preview, not bare PREVIEW text).
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- runFlow:
    file: ../../common/sign-in-password.yaml
    env:
      SIGN_IN_EMAIL: ${QA_TRAINER_EMAIL}
- runFlow: ../../common/wait-attention-loaded.yaml
- runFlow:
    file: ../../device/z12-50/nudge-client.yaml
    env:
      CLIENT: Rohan Mehta
      CLIENT_SLUG: rohan-mehta
- runFlow: ../../device/z12-50/open-sheet.yaml
- takeScreenshot: TM-04b
- runFlow:
    when:
      visible: ".*quiet hours.*"
    commands:
      - takeScreenshot: TM-04c
- runFlow: ../../common/assert-no-crash.yaml
- tapOn: ".*Send nudge.*"
- extendedWaitUntil:
    visible: ".*Nudge sent.*"
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible: ".*Nudge sent.*"
    commands:
      - takeScreenshot: TM-04m
- extendedWaitUntil:
    visible: ".*You nudged .* again tomorrow.*"
    timeout: 6000
    optional: true
- runFlow:
    when:
      visible: ".*You nudged .* again tomorrow.*"
    commands:
      - takeScreenshot: TM-04n
      - tapOn: ".*Close.*"
- extendedWaitUntil:
    notVisible:
      id: "nudge-preview"
    timeout: 20000
- runFlow: ../../common/assert-no-crash.yaml

- extendedWaitUntil:
    notVisible: ".*Nudge sent.*"
    timeout: 15000
- runFlow: ../../device/z12-50/to-nudge.yaml
- runFlow: ../../device/z12-50/open-sheet.yaml
- tapOn: ".*Send nudge.*"
- extendedWaitUntil:
    visible: ".*You nudged .* again tomorrow.*"
    timeout: 20000
- takeScreenshot: TM-04n
- runFlow: ../../common/assert-no-crash.yaml
- tapOn: ".*Close.*"
- extendedWaitUntil:
    notVisible:
      id: "nudge-preview"
    timeout: 10000

- runFlow:
    file: ../../device/z12-50/nudge-client.yaml
    env:
      CLIENT: Ishita Banerjee
      CLIENT_SLUG: ishita-banerjee
- runFlow: ../../device/z12-50/open-sheet.yaml
- extendedWaitUntil:
    visible: ".*has turned off FitBud notifications.*"
    timeout: 20000
- takeScreenshot: TM-04o
- runFlow: ../../common/assert-no-crash.yaml
- tapOn: ".*Send nudge.*"
- extendedWaitUntil:
    notVisible:
      id: "nudge-preview"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: "nudge-preview"
    commands:
      - tapOn: ".*Close.*"
- runFlow: ../../common/assert-no-crash.yaml
