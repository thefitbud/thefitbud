appId: com.thefitbud.mobile.staging
name: F20 Trainer nudges a client as a FitBud push (Z12-50)
tags:
  - device
  - trainer
  - z12-50
---
# F20 (D-W12-9, D-W12-10, D-W12-22, Z12-50 part 2). Account: the demo trainer rahul.coach
# on the local seed. Env from the device harness: QA_TRAINER_EMAIL, QA_PASSWORD,
# DEVICE_THEME. One local DB per job, and a nudge is one per item per client day, so the
# two themes of a job cannot both send the same nudge: light nudges Rohan Mehta (push
# on), dark nudges Priya Nair (push on). Whatever the theme, a repeat about the same
# item is sent again to show the TM-04n state.
#
# Screens and screenshots (named by v3 screen ID, see scripts/qa/device/collect-shots.mjs):
#   TM-03j  "Nudge {First} about…" picker (only when the client has several open items)
#   TM-04b  the nudge sheet (TM-04c instead when the run falls in the client's quiet
#           hours, 22:00 to 07:00 IST: the sheet is the same with the amber line)
#   TM-04m  the sent toast over the client screen
#   TM-04n  the same item again: "You nudged {First} about this at {time}…", Send off
#   TM-04o  Ishita Banerjee (FitBud pushes off): the amber push-off line; Send still works
#           and says it went to her inbox
#
# What this does not do: it does not receive the push (the harness's push extras and
# Z12-58's phone checklist do) and it does not open WhatsApp.
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- runFlow:
    file: ../../common/sign-in-password.yaml
    env:
      SIGN_IN_EMAIL: ${QA_TRAINER_EMAIL}
- extendedWaitUntil:
    visible: "Needs you [0-9]+"
    timeout: 60000
- extendedWaitUntil:
    notVisible: "Loading"
    timeout: 90000
- evalScript: "${output.client = (DEVICE_THEME == 'dark') ? 'Priya Nair' : 'Rohan Mehta'}"

# ---- A push-on client: sheet, send, sent toast ------------------------------------------
- runFlow:
    file: ../../device/z12-50/nudge-client.yaml
    env:
      CLIENT: ${output.client}
- runFlow: ../../device/z12-50/open-sheet.yaml
- takeScreenshot: TM-04b
- runFlow:
    when:
      visible: "It's .* inside their quiet hours.*"
    commands:
      - takeScreenshot: TM-04c
- runFlow: ../../common/assert-no-crash.yaml
- tapOn: "Send nudge"
- extendedWaitUntil:
    visible: "Nudge sent.*"
    timeout: 20000
- takeScreenshot: TM-04m
- runFlow: ../../common/assert-no-crash.yaml

# ---- The same item again: the TM-04n state (no second push) -----------------------------
- extendedWaitUntil:
    notVisible: "Nudge sent.*"
    timeout: 15000
- tapOn: "Nudge…"
- runFlow: ../../device/z12-50/open-sheet.yaml
- tapOn: "Send nudge"
- extendedWaitUntil:
    visible: "You nudged .* again tomorrow.*"
    timeout: 20000
- takeScreenshot: TM-04n
- runFlow: ../../common/assert-no-crash.yaml
- tapOn: "Close"
- extendedWaitUntil:
    notVisible: "PREVIEW · TAP TO EDIT"
    timeout: 10000

# ---- Push off: the line before sending, then inbox only ---------------------------------
- runFlow:
    file: ../../device/z12-50/nudge-client.yaml
    env:
      CLIENT: Ishita Banerjee
- runFlow: ../../device/z12-50/open-sheet.yaml
- extendedWaitUntil:
    visible: ".*has turned off FitBud notifications.*"
    timeout: 20000
- takeScreenshot: TM-04o
- runFlow: ../../common/assert-no-crash.yaml
- tapOn: "Send nudge"
- extendedWaitUntil:
    visible: "Nudge sent to .* inbox.*"
    timeout: 20000
- runFlow: ../../common/assert-no-crash.yaml
