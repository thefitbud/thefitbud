appId: com.thefitbud.mobile.staging
name: F22 Coach replies to a question (Z12-53)
tags:
  - device
  - trainer
  - z12-53
---
# F22: Asked-you Reply → ask-detail → Mark answered by id.
# Do not wait for bare "Asked you" — that matches the Attention section title
# (full-string regex would need .*, and Attention always has it).
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- runFlow:
    file: ../../common/sign-in-password.yaml
    env:
      SIGN_IN_EMAIL: ${QA_TRAINER_EMAIL}
- runFlow: ../../common/wait-attention-loaded.yaml
- takeScreenshot: TM-01a
- runFlow: ../../common/assert-no-crash.yaml

- scrollUntilVisible:
    element:
      id: "needs-you-reply"
    direction: DOWN
    timeout: 60000
- tapOn:
    id: "needs-you-reply"
- extendedWaitUntil:
    visible:
      id: "ask-detail"
    timeout: 30000
- assertVisible:
    id: "ask-mark-answered"
- takeScreenshot: TM-10a
- runFlow: ../../common/assert-no-crash.yaml
- assertVisible: ".*Reply on WhatsApp.*"
- tapOn:
    id: "ask-mark-answered"
- extendedWaitUntil:
    visible: ".*Answered.*|.*Undo.*"
    timeout: 15000
- takeScreenshot: TM-10b
- runFlow: ../../common/assert-no-crash.yaml
