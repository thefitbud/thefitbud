appId: com.thefitbud.mobile.staging
name: F22 Coach replies to a question (Z12-53)
tags:
  - device
  - trainer
  - z12-53
---
# F22 (Z12-53): open an Asked-you card from Needs you, reply path (WhatsApp
# prefill is never auto-sent), Mark answered. Demo seed has open asks
# (Rajesh / Divya). Env: QA_TRAINER_EMAIL, QA_PASSWORD, DEVICE_THEME.
#
# Screens: TM-01a, TM-10a, TM-10b (answered toast). Banner TM-13b is
# notification-driven and covered by Z12-58's phone checklist.
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- runFlow:
    file: ../../common/sign-in-password.yaml
    env:
      SIGN_IN_EMAIL: ${QA_TRAINER_EMAIL}
- runFlow: ../../common/wait-attention-loaded.yaml
- takeScreenshot: TM-01a
- runFlow: ../../common/assert-no-crash.yaml

# Open the first ask Reply (section may need a scroll).
- scrollUntilVisible:
    element: "Reply"
    direction: DOWN
    timeout: 60000
- tapOn: "Reply"
- extendedWaitUntil:
    visible: "Asked you|Mark answered|Reply on WhatsApp"
    timeout: 30000
- takeScreenshot: TM-10a
- runFlow: ../../common/assert-no-crash.yaml
- assertVisible: "Mark answered"
- assertVisible: "Reply on WhatsApp"
# Mark answered (Undo toast = TM-10b path). Do not open WhatsApp.
- tapOn: "Mark answered"
- extendedWaitUntil:
    visible: "Answered|Undo|Needs you"
    timeout: 15000
- takeScreenshot: TM-10b
- runFlow: ../../common/assert-no-crash.yaml
