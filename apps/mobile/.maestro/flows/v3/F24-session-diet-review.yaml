appId: com.thefitbud.mobile.staging
name: F24 Coach reviews a session and a diet day (Z12-53)
tags:
  - device
  - trainer
  - z12-53
---
# F24 (Z12-53): session detail from Needs you / Activity when present; diet day
# review from a client's Review day (TM-12a) and a meal sheet (TM-12b). Priya
# Nair is the TM-12b seed persona (D-W12-30). Env: QA_TRAINER_EMAIL, QA_PASSWORD.
#
# Screens: TM-11a (when a win/session opens), TM-12a, TM-12b.
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- runFlow:
    file: ../../common/sign-in-password.yaml
    env:
      SIGN_IN_EMAIL: ${QA_TRAINER_EMAIL}
- runFlow: ../../common/wait-attention-loaded.yaml
- takeScreenshot: TM-01a2
- runFlow: ../../common/assert-no-crash.yaml

# Optional: open a workout win / session card when the seed shows one.
- runFlow:
    when:
      visible: "PR|finished|sets"
    commands:
      - tapOn: "PR|finished|sets"
      - extendedWaitUntil:
          visible: "Workout|Add note|Reply on WhatsApp|sets"
          timeout: 20000
          optional: true
      - takeScreenshot: TM-11a
      - runFlow: ../../common/assert-no-crash.yaml
      - tapOn: "Back|‹"
      - extendedWaitUntil:
          visible: "Needs you|Clients"
          timeout: 20000

# Diet day: Clients → Priya Nair → Review day.
- tapOn: "Clients"
- extendedWaitUntil:
    visible: "Clients"
    timeout: 30000
- scrollUntilVisible:
    element: "Priya Nair.*"
    direction: DOWN
    timeout: 60000
- tapOn: "Priya Nair.*"
- extendedWaitUntil:
    visible: "Review day|Today's food|This week"
    timeout: 30000
- tapOn: "Review day"
- extendedWaitUntil:
    visible: "Food|Meals ·"
    timeout: 30000
- takeScreenshot: TM-12a
- runFlow: ../../common/assert-no-crash.yaml

# Open a meal row for the sheet (prefer Ate out when present).
- runFlow:
    when:
      visible: "Ate out"
    commands:
      - tapOn: ".*Ate out.*"
- runFlow:
    when:
      notVisible: "Plan|Logged|WhatsApp"
    commands:
      - tapOn: "Breakfast.*|Lunch.*|Dinner.*|Snack.*|Early morning.*"
- extendedWaitUntil:
    visible: "Plan|Logged|WhatsApp|Add note"
    timeout: 20000
- takeScreenshot: TM-12b
- runFlow: ../../common/assert-no-crash.yaml
- assertVisible: "WhatsApp"
- tapOn: "Dismiss|Close"
- runFlow: ../../common/assert-no-crash.yaml
