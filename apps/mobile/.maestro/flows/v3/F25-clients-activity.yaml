appId: com.thefitbud.mobile.staging
name: F25 Clients, activity and client detail (Z12-53)
tags:
  - device
  - trainer
  - z12-53
env:
  CLIENT_SLUG: rohan-mehta
---
# F25: client overlay hides the tab bar — leave via client-back before tab-clients.
# Nudge picker title is the full string "Nudge Rohan about…" (not bare "about").
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- runFlow:
    file: ../../common/sign-in-password.yaml
    env:
      SIGN_IN_EMAIL: ${QA_TRAINER_EMAIL}
- runFlow: ../../common/wait-attention-loaded.yaml
- tapOn:
    id: "tab-clients"
- extendedWaitUntil:
    visible: ".*Clients.*"
    timeout: 30000
- takeScreenshot: TM-02a
- runFlow: ../../common/assert-no-crash.yaml

- scrollUntilVisible:
    element:
      id: "client-row-${CLIENT_SLUG}"
    direction: DOWN
    timeout: 60000
- tapOn:
    id: "client-row-${CLIENT_SLUG}"
- extendedWaitUntil:
    visible:
      id: "client-status"
    timeout: 30000
- takeScreenshot: TM-03a
- runFlow: ../../common/assert-no-crash.yaml

- runFlow:
    when:
      visible:
        id: "client-nudge"
    commands:
      - tapOn:
          id: "client-nudge"
      - extendedWaitUntil:
          visible: ".*Nudge .* about.*|.*Send nudge.*|.*Close.*|.*Cancel.*|.*nudge-pick.*"
          timeout: 15000
      - extendedWaitUntil:
          visible:
            id: "nudge-pick-next"
          timeout: 5000
          optional: true
      - takeScreenshot: TM-03j
      - tapOn: ".*Close.*|.*Cancel.*|.*Dismiss.*"
      - extendedWaitUntil:
          visible:
            id: "client-status"
          timeout: 15000

- runFlow:
    when:
      visible: ".*More.*"
    commands:
      - tapOn: ".*More.*"
- runFlow:
    when:
      visible: ".*Goal, intake and limitations.*"
    commands:
      - takeScreenshot: TM-03i
      - tapOn: ".*Goal, intake and limitations.*"
      - extendedWaitUntil:
          visible: ".*Goal.*|.*intake.*|.*limitations.*|.*Back.*"
          timeout: 20000
      - takeScreenshot: TM-03f
      - runFlow: ../../common/assert-no-crash.yaml
      - tapOn: ".*Back.*|.*‹.*"

# Leave the client overlay so the tab bar is in the hierarchy again.
- runFlow:
    when:
      visible:
        id: "client-back"
    commands:
      - tapOn:
          id: "client-back"
- extendedWaitUntil:
    visible:
      id: "tab-clients"
    timeout: 20000
- tapOn:
    id: "tab-clients"
- extendedWaitUntil:
    visible: ".*Clients.*"
    timeout: 20000
- runFlow:
    when:
      visible: ".*Activity.*"
    commands:
      - tapOn: ".*Activity.*"
      - extendedWaitUntil:
          visible: ".*Activity.*|.*All.*|.*Meals.*|.*Workouts.*"
          timeout: 30000
      - takeScreenshot: TM-09a
      - runFlow: ../../common/assert-no-crash.yaml
      - runFlow:
          when:
            visible: ".*All clients.*|.*Filter.*|.*Client.*"
          commands:
            - tapOn: ".*All clients.*|.*Filter.*|.*Client.*"
            - takeScreenshot: TM-09d
