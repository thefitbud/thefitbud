appId: com.thefitbud.mobile.staging
name: F01 Onboarding states, intake and waiting for the coach (Z12-49)
tags:
  - device
  - trainee
  - z12-49
env:
  # Public demo accounts on the local seed (same demo password as the others).
  INTAKE_EMAIL: vikram.onboarding@demo.fitbud.test
  WAITING_EMAIL: sneha.review@demo.fitbud.test
---
# F01 (Z12-49), the onboarding states a fresh install reaches after the invite:
# Vikram has a part-filled intake (TR-03), Sneha has sent hers and waits for
# Rahul (TR-04: the plan card, "While you wait" rows, the outlined WhatsApp
# button, sign-out behind the account button). Accepting an invite (TR-02a/b)
# needs an invite token from a link the runner cannot open: Expo web only.
# Nothing here submits the intake, so the seed stays as it is.
# Env: QA_PASSWORD.
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Sign in with a code instead"
    timeout: 60000
- tapOn: "you@example.com or 9876543210"
- inputText: ${INTAKE_EMAIL}
- tapOn: "Your password"
- inputText: ${QA_PASSWORD}
- tapOn: "Use the mobile number or email your coach invited\\."
- tapOn:
    text: "Sign in"
    below: "Forgot password\\??"

# TR-03
- extendedWaitUntil:
    visible: "Getting to know you"
    timeout: 60000
- assertVisible: ".* of 5"
- takeScreenshot: TR-03
- runFlow: ../../common/assert-no-crash.yaml
- killApp

# TR-04
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Sign in with a code instead"
    timeout: 60000
- tapOn: "you@example.com or 9876543210"
- inputText: ${WAITING_EMAIL}
- tapOn: "Your password"
- inputText: ${QA_PASSWORD}
- tapOn: "Use the mobile number or email your coach invited\\."
- tapOn:
    text: "Sign in"
    below: "Forgot password\\??"
- extendedWaitUntil:
    visible: ".* is building your plan"
    timeout: 60000
- assertVisible: "WHILE YOU WAIT"
- assertVisible: "Intake form"
- assertNotVisible: "Pull to refresh for updates"
- takeScreenshot: TR-04
- runFlow: ../../common/assert-no-crash.yaml
- tapOn: "Reminders"
- extendedWaitUntil:
    visible: "REMIND ME ABOUT"
    timeout: 20000
- tapOn: "Back"
- extendedWaitUntil:
    visible: ".* is building your plan"
    timeout: 20000
- tapOn: "Account"
# Wait for the sheet to finish opening before tapping inside it (Android
# took the tap on the scrim while the sheet slid in).
- extendedWaitUntil:
    visible: "Your plan will be here as soon as it's ready\\."
    timeout: 10000
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Sign in with a code instead"
    timeout: 20000
- runFlow: ../../common/assert-no-crash.yaml
