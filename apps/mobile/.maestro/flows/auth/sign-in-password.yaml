appId: com.thefitbud.mobile.staging
name: Sign in with a password
tags:
  - auth
  - trainer
  - smoke
  - full
---
# Password sign-in as the QA trainer.
#
# Env from the runner: QA_TRAINER_EMAIL, QA_PASSWORD.
# No screenshot while the form is being filled in.
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Sign in with a code instead"
    timeout: 30000
- takeScreenshot: auth-sign-in-password__start
- runFlow: ../../common/assert-no-crash.yaml

- runFlow:
    file: ../../common/sign-in-password.yaml
    env:
      SIGN_IN_EMAIL: ${QA_TRAINER_EMAIL}
# The trainer account has one role, so there is no role select; it lands on the
# attention inbox.
- assertVisible: "Needs you"
- assertVisible: "Clients"
- assertNotVisible: "Sign in with a code instead"
- takeScreenshot: auth-sign-in-password__signed-in
- runFlow: ../../common/assert-no-crash.yaml
