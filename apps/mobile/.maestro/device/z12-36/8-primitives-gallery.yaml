appId: com.thefitbud.mobile.staging
name: Z12-36 primitives gallery, section by section
tags:
  - device
  - z12-36
---
# Every rebuilt primitive on its v3 tokens, in the theme of the run (the gallery opts in
# to the system theme). The gate's Release build carries the gallery behind
# `fitbud://qa/primitives` (apps/mobile/src/providers/qaGallery.ts); a store or EAS
# build never contains it. Runs after the trainee and trainer flows, which each end on
# the gallery, so the link has already worked once on this install.
- launchApp:
    stopApp: false
    permissions:
      all: allow
- runFlow:
    when:
      notVisible: "Large title 30"
    file: open-gallery.yaml
- takeScreenshot: primitives-1-type
- runFlow: ../../common/assert-no-crash.yaml

# Each section is scrolled until one of its own elements is centred, so every capture
# shows a different part of the page (run 43673200079: without centring, sections
# already on screen did not scroll and two captures were identical).
# Buttons (kit .btn variants, disabled, small).
- scrollUntilVisible:
    element: "Quiet danger"
    centerElement: true
    timeout: 20000
- takeScreenshot: primitives-2-buttons
- runFlow: ../../common/assert-no-crash.yaml

# Chips, pills, status chips, badge.
- scrollUntilVisible:
    element: "3 × 10 @ 40 kg"
    centerElement: true
    timeout: 20000
- takeScreenshot: primitives-3-chips
- runFlow: ../../common/assert-no-crash.yaml

# Card, due card, grouped list rows.
- scrollUntilVisible:
    element: "Due card"
    centerElement: true
    timeout: 20000
- takeScreenshot: primitives-4-cards
- runFlow: ../../common/assert-no-crash.yaml

# Field, segmented control, error banner, toast, tab bar.
- scrollUntilVisible:
    element: "Meal logged"
    centerElement: true
    timeout: 20000
- scrollUntilVisible:
    element: "Open sheet"
    timeout: 20000
- takeScreenshot: primitives-5-inputs-toast-tabbar
- runFlow: ../../common/assert-no-crash.yaml

# Sheet over the scrim.
- tapOn: "Open sheet"
- extendedWaitUntil:
    visible: "Sheet title"
    timeout: 10000
- takeScreenshot: primitives-6-sheet
- runFlow: ../../common/assert-no-crash.yaml
- tapOn: "Close sheet"
- extendedWaitUntil:
    notVisible: "Sheet title"
    timeout: 10000

# Back to the top, so 9-gallery-hold.yaml (and, after the flip, 1-primitives-gallery.yaml)
# find the gallery's first line on screen.
- scrollUntilVisible:
    element: "Large title 30"
    direction: UP
    timeout: 20000
