# Subflow (Z12-36): open the QA primitive gallery with fitbud://qa/primitives and wait
# for it. On iOS the simulator may first ask "Open in “FitBud Staging”?" (a SpringBoard
# alert that clearState does not dismiss, so it blocks every later flow: runs 43643116147
# and 43669586698). A conditional wait on the alert's text was not reliable (run
# 43669586698 timed out while the alert was up), so "Open" is tapped optionally: it is
# skipped when no alert shows. "Open" is matched exactly, so the gallery's "Open sheet"
# never matches.
# No `tags:`, so the device gate never selects this file as a flow; `appId` is required
# by Maestro for any file reached by `runFlow:` (see common/assert-no-crash.yaml).
appId: com.thefitbud.mobile.staging
---
- openLink: fitbud://qa/primitives
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Large title 30"
    timeout: 60000
