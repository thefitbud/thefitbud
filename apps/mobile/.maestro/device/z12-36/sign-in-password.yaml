# Task-local copy of common/sign-in-password.yaml (Z12-36). Keep behaviour in
# lockstep with the shared subflow (exact email assert + clear/retry before Sign
# in; home wait includes "This week"; check-in review banner drain). Drop this
# copy once callers can use common/sign-in-password.yaml for the slipping account
# path.
#
appId: com.thefitbud.mobile.staging
---
- extendedWaitUntil:
    visible: "Sign in with a code instead"
    timeout: 30000
- tapOn: "you@example.com or 9876543210"
- eraseText: 80
- inputText: ${SIGN_IN_EMAIL}
- runFlow:
    when:
      notVisible: "${SIGN_IN_EMAIL}"
    commands:
      - eraseText: 80
      - inputText: ${SIGN_IN_EMAIL}
- assertVisible: "${SIGN_IN_EMAIL}"
- tapOn:
    id: "sign-in-password"
- eraseText: 80
- inputText: ${QA_PASSWORD}
# Same password filled assert as common/sign-in-password.yaml (FitBud #484).
- runFlow:
    when:
      notVisible: "Password, entered"
    commands:
      - tapOn:
          id: "sign-in-password"
      - eraseText: 80
      - inputText: ${QA_PASSWORD}
- assertVisible: "Password, entered"
# Dismiss the keyboard by tapping inert text: the sign-in sheet is a ScrollView
# with keyboardShouldPersistTaps="handled", so this works on iOS and Android.
# Maestro's hideKeyboard cannot dismiss the iOS keyboard here (Z5-5, #241).
- tapOn: "Use the mobile number or email your coach invited\\."
# Password focus can clear the email field (Android dark launch 44484383185).
- runFlow:
    when:
      notVisible: "${SIGN_IN_EMAIL}"
    commands:
      - tapOn: "you@example.com or 9876543210"
      - eraseText: 80
      - inputText: ${SIGN_IN_EMAIL}
      - assertVisible: "${SIGN_IN_EMAIL}"
      - tapOn:
          id: "sign-in-password"
      - eraseText: 80
      - inputText: ${QA_PASSWORD}
      - assertVisible: "Password, entered"
      - tapOn: "Use the mobile number or email your coach invited\\."
- runFlow:
    when:
      notVisible: "Password, entered"
    commands:
      - tapOn:
          id: "sign-in-password"
      - eraseText: 80
      - inputText: ${QA_PASSWORD}
- assertVisible: "Password, entered"
# "Sign in" is also the screen title; the button is the one under "Forgot password?".
# The anchor matches with or without the "?": that link is a Pressable with
# accessibilityLabel="Forgot password" (SignInScreen.tsx), and iOS exposes only
# that label, while Android also exposes the inner "Forgot password?" text
# (Z5-5b, cause 8: job 127176024926, "Element not found ... Below: Forgot password\?").
- tapOn:
    text: "Sign in"
    below: "Forgot password\\??"
# Same date-independent home proof as common/sign-in-password.yaml (FitBud batch 2).
- extendedWaitUntil:
    visible:
      id: "today-summary"
    timeout: 3000
    optional: true
- extendedWaitUntil:
    visible: "Today's workout.*|This week|Rest day|Recovery is part of the plan|View summary|Needs you.*|Choose mode|preparing your plan"
    timeout: 60000
- runFlow:
    when:
      visible: ".*reviewed your check-in.*"
    commands:
      - extendedWaitUntil:
          notVisible: ".*reviewed your check-in.*"
          timeout: 15000
