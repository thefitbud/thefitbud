# Task-local copy of common/sign-in-password.yaml (Z12-36), identical except the final
# wait. On iOS a rest-day Today exposes only "Today's workout: rest day" (one
# accessibility label), which the shared subflow's exact "Today's workout" does not
# match (device gate run 43657287248: sign-in succeeded, the wait failed). Android
# exposes both texts, so the shared file passes there. Reported to the harness owner;
# drop this copy once common/sign-in-password.yaml accepts "Today's workout.*".
#
appId: com.thefitbud.mobile.staging
---
- extendedWaitUntil:
    visible: "Sign in with a code instead"
    timeout: 30000
- tapOn: "you@example.com or 9876543210"
- inputText: ${SIGN_IN_EMAIL}
- tapOn: "Your password"
- inputText: ${QA_PASSWORD}
# Dismiss the keyboard by tapping inert text: the sign-in sheet is a ScrollView
# with keyboardShouldPersistTaps="handled", so this works on iOS and Android.
# Maestro's hideKeyboard cannot dismiss the iOS keyboard here (Z5-5, #241).
- tapOn: "Your coach's plan for today is waiting\\."
# "Sign in" is also the screen title; the button is the one under "Forgot password?".
# The anchor matches with or without the "?": that link is a Pressable with
# accessibilityLabel="Forgot password" (SignInScreen.tsx), and iOS exposes only
# that label, while Android also exposes the inner "Forgot password?" text
# (Z5-5b, cause 8: job 127176024926, "Element not found ... Below: Forgot password\?").
- tapOn:
    text: "Sign in"
    below: "Forgot password\\??"
- extendedWaitUntil:
    visible: "Today's workout.*|Needs you.*|Choose mode"
    timeout: 30000
