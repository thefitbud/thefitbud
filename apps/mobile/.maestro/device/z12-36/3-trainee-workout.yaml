appId: com.thefitbud.mobile.staging
name: Z12-36 trainee active workout mid-session (W-03)
tags:
  - device
  - trainee
  - z12-36
---
# Rohan Mehta (slipping, local demo seed). The seed leaves the most recent Saturday's
# "Lower body B" unlogged (apps/api/src/seed/demo/history.ts: the last six days'
# Saturday). Z12-44 (v3 Workout tab): the strip no longer names workouts ("Sat Lower
# B"), so the flow selects last Saturday on the strip (its label comes from the
# device clock, z12-44/ist-days.yaml) and opens it: the light run starts it ("Log
# workout", a late log), the dark run continues the same session. It leaves today's
# workout and this week's missed one to z12-44/2 (W-01a and TR-10c in both themes,
# Z12-44 review). On a Saturday, when last Saturday was logged, it falls back to
# z12-44/open-session.yaml. It logs one set, skips the rest and captures the active
# workout mid-session. Same opt-in note as 2-trainee-today-diet.
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- runFlow:
    file: sign-in-password.yaml
    env:
      SIGN_IN_EMAIL: ${QA_SLIPPING_EMAIL}
- extendedWaitUntil:
    notVisible: ".*Loading your day.*"
    timeout: 30000

# "Workout" also names a tile on Today; the tab is the later match. If the first tap
# left Today on screen (its macro summary is still there), tap the tab bar's match.
- tapOn: "Workout"
- runFlow:
    when:
      visible: ".*of [0-9,]+ kcal"
    commands:
      - tapOn:
          text: "Workout"
          index: 1
- extendedWaitUntil:
    notVisible: "Loading workouts…"
    timeout: 30000
- runFlow: ../z12-44/ist-days.yaml
# Last Saturday is in the previous week of the strip except on a Sunday.
- runFlow:
    when:
      notVisible: "${output.lastSat}, .*"
    commands:
      - tapOn: "Previous week"
      - extendedWaitUntil:
          notVisible: "Loading workouts…"
          timeout: 30000
- tapOn: "${output.lastSat}, .*"
- extendedWaitUntil:
    notVisible: "Loading workouts…"
    timeout: 30000
# Z12-45 (W-18): a cleared app that reaches the day of an open workout is asked
# "Pick up where you left off?" once the session is read. Resume answers it.
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Pick up where you left off\\?"
    commands:
      - tapOn: "Resume workout"
      - extendedWaitUntil:
          visible: "Log set [0-9]+ ·.*"
          timeout: 30000
- runFlow:
    when:
      notVisible: "Log set [0-9]+ ·.*"
      visible: "Log workout|Continue workout"
    commands:
      - tapOn: "Log workout|Continue workout"
      - extendedWaitUntil:
          visible: "Log set [0-9]+ ·.*"
          timeout: 30000
- runFlow:
    when:
      notVisible: "Log set [0-9]+ ·.*"
    commands:
      - tapOn: "Go to today"
      - extendedWaitUntil:
          notVisible: "Loading workouts…"
          timeout: 30000
      - runFlow: ../z12-44/open-session.yaml
- extendedWaitUntil:
    visible: "Log set [0-9]+ ·.*"
    timeout: 30000
- tapOn: "Log set [0-9]+ ·.*"
# Z12-45: the rest bar's timer reads "Rest, 1:30 left".
- extendedWaitUntil:
    visible: "Rest, [0-9]+:[0-9]{2} left"
    timeout: 10000
- tapOn: "Skip rest"
- extendedWaitUntil:
    notVisible: "Rest, [0-9]+:[0-9]{2} left"
    timeout: 10000
- takeScreenshot: W-03
- runFlow: ../../common/assert-no-crash.yaml

- runFlow: open-gallery.yaml
