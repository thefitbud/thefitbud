appId: com.thefitbud.mobile.staging
name: Z12-36 trainee active workout mid-session (W-03)
tags:
  - device
  - trainee
  - z12-36
---
# Rohan Mehta (slipping, local demo seed). The seed leaves the most recent Saturday's
# "Lower body B" unlogged (apps/api/src/seed/demo/history.ts: the last six days'
# Saturday) and his last two days unlogged, so a session can be opened whatever the
# runner's day is. Z12-44 (v3 Workout tab): the strip no longer names workouts ("Sat
# Lower B") and a tap on a day only selects it, so the flow takes, in order, today's
# Start or Continue, else the missed banner's "Log it", else the Saturday of this week
# or the week before ("Log workout" or "Continue workout" on that day's card). The
# light run starts a session, the dark run continues it. (Run 43645505100: the day's
# own hero was a rest day, and the light run used up the only "Log it".) It logs one
# set, skips the rest and captures the active workout mid-session. Same opt-in note
# as 2-trainee-today-diet.
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- runFlow:
    file: sign-in-password.yaml
    env:
      SIGN_IN_EMAIL: ${QA_SLIPPING_EMAIL}
- extendedWaitUntil:
    notVisible: ".*Loading your day.*"
    timeout: 30000

# "Workout" also names a tile on Today; the tab is the later match. If the first tap
# left Today on screen (its macro summary is still there), tap the tab bar's match.
- tapOn: "Workout"
- runFlow:
    when:
      visible: ".*of [0-9,]+ kcal"
    commands:
      - tapOn:
          text: "Workout"
          index: 1
- extendedWaitUntil:
    notVisible: "Loading workouts…"
    timeout: 30000
- runFlow: ../z12-44/open-session.yaml
- extendedWaitUntil:
    visible: "Log set [0-9]+ ·.*"
    timeout: 30000
- tapOn: "Log set [0-9]+ ·.*"
- extendedWaitUntil:
    visible: "REST"
    timeout: 10000
- tapOn: "Skip rest"
- extendedWaitUntil:
    notVisible: "REST"
    timeout: 10000
- takeScreenshot: W-03
- runFlow: ../../common/assert-no-crash.yaml

- runFlow: open-gallery.yaml
