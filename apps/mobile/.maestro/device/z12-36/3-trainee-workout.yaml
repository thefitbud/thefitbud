appId: com.thefitbud.mobile.staging
name: Z12-36 trainee active workout mid-session (W-03)
tags:
  - device
  - trainee
  - z12-36
---
# Rohan Mehta (slipping, local demo seed). The seed leaves his last two days and a
# Saturday of the last six days unlogged (apps/api/src/seed/demo/history.ts). Z12-44
# (v3 Workout tab): the strip no longer names workouts ("Sat Lower B"), so the flow
# selects a day on the strip by its date label and opens it: the light run starts it
# ("Log workout", a late log), the dark run continues the same session. Which day
# depends on the weekday (IST) and is worked out by z12-44/ist-days.js: last Saturday
# when it is still open, else this week's newest missed workout (Saturday). It
# leaves today's workout and the other missed ones to z12-44/2 (W-01a, TR-10c). When
# no workout is open (Sunday dark, Monday dark) the capture is skipped, logged by
# ist-days.js ("SKIP ..."); the day is never guessed. It logs one set, skips the rest
# and captures the active workout mid-session. Same opt-in note as
# 2-trainee-today-diet.
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- runFlow:
    file: sign-in-password.yaml
    env:
      SIGN_IN_EMAIL: ${QA_SLIPPING_EMAIL}
# Drain check-in review banner; prove Today with an above-the-fold marker (FitBud #485).
- runFlow: ../../common/wait-trainee-today-ready.yaml

# Tab bar by testID (not the Today "Workout" tile). Assert Workout before the
# strip / select-day steps so a wrong tab fails here (44517473406 iOS dark).
- runFlow: ../z12-44/open-workout-tab.yaml
- runFlow: ../z12-44/ist-days.yaml
- runFlow:
    when:
      true: ${output.z36Label != ''}
    commands:
      - runFlow:
          file: ../z12-44/select-day.yaml
          env:
            LABEL: ${output.z36Label}
      # No fallback to another day: the day is open ("Log workout") or already the
      # session this flow's light run left ("Continue workout"), or the seed is wrong.
      # The CTA sits below the exercise list on a past-day card (FitBud 44501381102
      # iOS W-03: Log workout was below the fold). Centre it so the tab bar (the dark
      # run's Continue card is taller) cannot cover it and take the tap (FitBud
      # 44536235116: the tap hit the Diet tab). A tap that lands elsewhere fails on the
      # Log set assert below; there is no re-tap recovery.
      - scrollUntilVisible:
          element:
            id: "workout-day-cta"
          direction: DOWN
          centerElement: true
          visibilityPercentage: 100
          timeout: 60000
      # Z12-45 (W-18): a cleared app that reaches the day of an open workout is asked
      # "Pick up where you left off?" once the session is read. Resume answers it.
      - waitForAnimationToEnd:
          timeout: 3000
      - runFlow:
          when:
            visible: "Pick up where you left off\\?"
          commands:
            - tapOn: "Resume workout"
            - extendedWaitUntil:
                visible: "Log set [0-9]+ ·.*"
                timeout: 30000
      - runFlow:
          when:
            notVisible: "Log set [0-9]+ ·.*"
          commands:
            - tapOn:
                id: "workout-day-cta"
            - extendedWaitUntil:
                visible: "Log set [0-9]+ ·.*"
                timeout: 30000
      - tapOn: "Log set [0-9]+ ·.*"
      # Z12-45: the rest bar's timer reads "Rest, 1:30 left".
      - extendedWaitUntil:
          visible: "Rest, [0-9]+:[0-9]{2} left"
          timeout: 10000
      - tapOn: "Skip rest"
      - extendedWaitUntil:
          notVisible: "Rest, [0-9]+:[0-9]{2} left"
          timeout: 10000
      - takeScreenshot: W-03
      - runFlow: ../../common/assert-no-crash.yaml

- runFlow: open-gallery.yaml
