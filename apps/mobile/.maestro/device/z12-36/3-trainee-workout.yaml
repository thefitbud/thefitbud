appId: com.thefitbud.mobile.staging
name: Z12-36 trainee active workout mid-session (W-03)
tags:
  - device
  - trainee
  - z12-36
---
# Rohan Mehta (slipping, local demo seed). The runner's local day can be a rest day
# (run 43643116147 ran on Sun 15 Nov IST), so the flow takes today's workout when there
# is one ("Start workout" / "Continue workout") and otherwise a missed one from this week
# ("Log it", "Missed · you can still log it"). It logs one set, skips the rest and
# captures the active workout mid-session. Same opt-in note as 2-trainee-today-diet.
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- runFlow:
    file: ../../common/sign-in-password.yaml
    env:
      SIGN_IN_EMAIL: ${QA_SLIPPING_EMAIL}
- extendedWaitUntil:
    notVisible: ".*Loading your day.*"
    timeout: 30000

# "Workout" also names a tile on Today; the tab is the later match. If the first tap
# left Today on screen (its macro summary is still there), tap the tab bar's match.
- tapOn: "Workout"
- runFlow:
    when:
      visible: ".*of [0-9,]+ kcal"
    commands:
      - tapOn:
          text: "Workout"
          index: 1
- scrollUntilVisible:
    element: "Start workout|Continue workout|Log it"
    timeout: 30000
- runFlow:
    when:
      visible: "Start workout|Continue workout"
    commands:
      - tapOn: "Start workout|Continue workout"
- runFlow:
    when:
      notVisible: "Start workout|Continue workout"
    commands:
      - tapOn: "Log it"
- extendedWaitUntil:
    visible: "Log set [0-9]+ ·.*"
    timeout: 30000
- tapOn: "Log set [0-9]+ ·.*"
- extendedWaitUntil:
    visible: "REST"
    timeout: 10000
- tapOn: "Skip rest"
- extendedWaitUntil:
    notVisible: "REST"
    timeout: 10000
- takeScreenshot: W-03
- runFlow: ../../common/assert-no-crash.yaml

- runFlow: open-gallery.yaml
