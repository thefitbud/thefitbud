appId: com.thefitbud.mobile.staging
name: Z12-36 trainee active workout mid-session (W-03)
tags:
  - device
  - trainee
  - z12-36
---
# Rohan Mehta (slipping, local demo seed). The seed keeps this week's Saturday
# "Lower body B" startable (apps/api/src/seed/demo/history.ts), so the flow opens it
# from the Workout tab's week strip ("Sat Lower B") whatever the runner's day is: the
# light run starts it, the dark run continues the same session. (Run 43645505100: the
# day's own hero was a rest day, and the light run used up the only "Log it".) It logs
# one set, skips the rest and captures the active workout mid-session. Same opt-in
# note as 2-trainee-today-diet.
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- runFlow:
    file: ../../common/sign-in-password.yaml
    env:
      SIGN_IN_EMAIL: ${QA_SLIPPING_EMAIL}
- extendedWaitUntil:
    notVisible: ".*Loading your day.*"
    timeout: 30000

# "Workout" also names a tile on Today; the tab is the later match. If the first tap
# left Today on screen (its macro summary is still there), tap the tab bar's match.
- tapOn: "Workout"
- runFlow:
    when:
      visible: ".*of [0-9,]+ kcal"
    commands:
      - tapOn:
          text: "Workout"
          index: 1
- extendedWaitUntil:
    visible: "Sat Lower B"
    timeout: 30000
- tapOn: "Sat Lower B"
- extendedWaitUntil:
    visible: "Start workout|Continue workout"
    timeout: 30000
- tapOn: "Start workout|Continue workout"
- extendedWaitUntil:
    visible: "Log set [0-9]+ ·.*"
    timeout: 30000
- tapOn: "Log set [0-9]+ ·.*"
- extendedWaitUntil:
    visible: "REST"
    timeout: 10000
- tapOn: "Skip rest"
- extendedWaitUntil:
    notVisible: "REST"
    timeout: 10000
- takeScreenshot: W-03
- runFlow: ../../common/assert-no-crash.yaml

- runFlow: open-gallery.yaml
