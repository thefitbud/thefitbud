appId: com.thefitbud.mobile.staging
name: Z12-36 trainer Needs you (TM-01a) and the nudge sheet (TM-04b)
tags:
  - device
  - trainer
  - z12-36
env:
  # "Needs you <n>" shows over the skeleton too (AttentionTab.tsx), so the wait on it is
  # followed by a wait for "Loading" to go (as in device/z12-33).
  ATTENTION_LOADED: "Needs you [0-9]+"
  CLIENT: Rohan Mehta
---
# Same opt-in note as 2-trainee-today-diet: these screens stay light in the dark run
# until their own W12 task opts them in.
#
# The nudge sheet today is the exception review's "Nudge" sheet
# (ExceptionReviewScreen.tsx -> NudgeSheet.tsx); the review sheet's "Nudge…" on Needs
# you opens WhatsApp directly (run 43643116147 landed in Chrome), so it is not used.
# The sheet is opened and closed; nothing is sent (WhatsApp is only ever a prefill the
# trainer sends).
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- runFlow:
    file: sign-in-password.yaml
    env:
      SIGN_IN_EMAIL: ${QA_TRAINER_EMAIL}
- extendedWaitUntil:
    visible: "${ATTENTION_LOADED}"
    timeout: 30000
- extendedWaitUntil:
    notVisible: "Loading"
    timeout: 60000
- takeScreenshot: TM-01a
- runFlow: ../../common/assert-no-crash.yaml

# Clients -> Rohan -> Review -> exception review -> Nudge on WhatsApp (as flows/trainer/
# attention.yaml and device/z12-33 reach a client: the row, never the list container).
- tapOn: "Clients"
- scrollUntilVisible:
    element: "[A-Z]{2},? ${CLIENT}.*|${CLIENT}"
    timeout: 30000
- tapOn: "[A-Z]{2},? ${CLIENT}.*|${CLIENT}"
- extendedWaitUntil:
    visible: "Review"
    timeout: 30000
- tapOn: "Review"
- extendedWaitUntil:
    visible: "Review the signal, then acknowledge or resolve.*"
    timeout: 20000
- extendedWaitUntil:
    notVisible: "Loading exception…"
    timeout: 20000
- scrollUntilVisible:
    element: "Nudge"
    timeout: 20000
- tapOn: "Nudge"
- extendedWaitUntil:
    visible: "PREVIEW · TAP TO EDIT"
    timeout: 20000
- takeScreenshot: TM-04b
- runFlow: ../../common/assert-no-crash.yaml
- tapOn: "Close"
- extendedWaitUntil:
    notVisible: "PREVIEW · TAP TO EDIT"
    timeout: 10000

- runFlow: open-gallery.yaml
