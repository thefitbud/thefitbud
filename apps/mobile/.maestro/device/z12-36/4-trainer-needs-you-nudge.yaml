appId: com.thefitbud.mobile.staging
name: Z12-36 trainer Needs you (TM-01a) and the nudge sheet (TM-04b)
tags:
  - device
  - trainer
  - z12-36
env:
  # Attention loaded: common/wait-attention-loaded.yaml (attention-screen + title).
  CLIENT: Rohan Mehta
---
# Same opt-in note as 2-trainee-today-diet: these screens stay light in the dark run
# until their own W12 task opts them in.
#
# The nudge sheet here is the exception review's "Nudge" sheet
# (ExceptionReviewScreen.tsx -> NudgeSheet.tsx). Since Z12-51 the review sheet's
# "Nudge…" on Needs you opens the same FitBud sheet (flows/v3/F21 covers it). The sheet
# is opened and closed; nothing is sent.
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- runFlow:
    file: sign-in-password.yaml
    env:
      SIGN_IN_EMAIL: ${QA_TRAINER_EMAIL}
- runFlow: ../../common/wait-attention-loaded.yaml
- takeScreenshot: TM-01a
- runFlow: ../../common/assert-no-crash.yaml

# Clients -> Rohan -> Review -> exception review -> Nudge on WhatsApp (as flows/trainer/
# attention.yaml and device/z12-33 reach a client: the row, never the list container).
- tapOn: "Clients"
- scrollUntilVisible:
    element: "[A-Z]{2},? ${CLIENT}.*|${CLIENT}"
    timeout: 30000
- tapOn: "[A-Z]{2},? ${CLIENT}.*|${CLIENT}"
- extendedWaitUntil:
    visible: "Review"
    timeout: 30000
- tapOn: "Review"
# The v3 exception review (Z12-51): Nudge is a footer button once the item and the
# client's status have loaded.
- extendedWaitUntil:
    visible:
      id: "exception-nudge"
    timeout: 30000
- tapOn:
    id: "exception-nudge"
- extendedWaitUntil:
    visible: "PREVIEW · TAP TO EDIT"
    timeout: 20000
- takeScreenshot: TM-04b
- runFlow: ../../common/assert-no-crash.yaml
- tapOn: "Close"
- extendedWaitUntil:
    notVisible: "PREVIEW · TAP TO EDIT"
    timeout: 10000

- runFlow: open-gallery.yaml
