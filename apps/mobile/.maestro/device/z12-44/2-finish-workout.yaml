appId: com.thefitbud.mobile.staging
name: Z12-44 Finish a workout (in progress, relaunch, summary, View summary only)
tags:
  - device
  - trainee
  - z12-44
---
# Z12-44: finish a workout on the device. Rohan Mehta (slipping, local demo seed):
# today not started (W-01a), this week's missed workout in the banner (TR-10c).
# The flow opens a session, logs a set, kills and relaunches the app: the Workout
# tab shows it in progress with its clock and set count from the server (W-01b;
# the duration survives the relaunch). It then finishes it: summary (W-17a),
# shared (W-17b, week ticks equal to "N of M done"), and the day offers View
# summary only, also after another relaunch (ISSUE-MAP #4, #10).
#
# Today's state is asserted before anything branches on it (Z12-44 review): on a
# training day it must read "To do", on the other days Rest (ist-days.yaml). A
# seed made for another IST day fails here.
#
# One unlogged workout per use, so both themes get W-01a (Z12-44 review):
#   * z12-36/3 opens last Saturday's (light starts it, dark continues it);
#   * light here takes this week's missed one ("Log it", a late log), leaving
#     today untouched for the dark pass's W-01a;
#   * dark here takes today's ("Start workout"): the done-today path, checked
#     on Workout and on Today.
# Rohan's seed leaves those three open on a Tuesday or a Thursday (IST); on
# other days the flow still asserts today's state, and the missing shots show.
# Screens: W-01a, TR-10c, W-01b, W-17a, W-17b.
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- runFlow:
    file: ../../common/sign-in-password.yaml
    env:
      SIGN_IN_EMAIL: ${QA_SLIPPING_EMAIL}
- extendedWaitUntil:
    notVisible: ".*Loading your day.*"
    timeout: 30000
- runFlow: ist-days.yaml
- runFlow: open-workout-tab.yaml
# MANDATORY: the seed's day and the device's agree ("Thu 19 Nov, To do").
- assertVisible: "${output.today}, ${output.rohanToday}"

# ---- W-01a: today, not started (training day) -----------------------------------
- runFlow:
    when:
      true: ${output.trainingDay == 'yes'}
    commands:
      - assertVisible: "Start workout"
      - assertNotVisible: "Continue workout"
      - assertNotVisible: "View summary"
      - takeScreenshot: W-01a-workout-tab-not-started
- runFlow:
    when:
      visible: "You missed .*"
    commands:
      - takeScreenshot: TR-10c-workout-missed-banner
- runFlow: ../../common/assert-no-crash.yaml

# ---- Open a session ---------------------------------------------------------------
# Dark, training day: today's (the done-today path).
- runFlow:
    when:
      true: ${DEVICE_THEME == 'dark' && output.trainingDay == 'yes'}
    commands:
      - tapOn: "Start workout"
      - extendedWaitUntil:
          visible: "Log set [0-9]+ ·.*"
          timeout: 30000
# Light: this week's missed workout, from the banner.
- runFlow:
    when:
      true: ${DEVICE_THEME != 'dark'}
      visible: "Log it"
    commands:
      - tapOn: "Log it"
      - extendedWaitUntil:
          visible: "Log set [0-9]+ ·.*"
          timeout: 30000
# Anything else (another weekday): whatever open-session finds.
- runFlow: open-session.yaml
- tapOn: "Log set [0-9]+ ·.*"
- runFlow:
    when:
      visible: "Skip rest"
    commands:
      - tapOn: "Skip rest"
- launchApp:
    clearState: false
# A cold relaunch shows the startup spinner first: wait for the tab bar.
- extendedWaitUntil:
    visible: "Diet"
    timeout: 120000
- extendedWaitUntil:
    notVisible: ".*Loading your day.*"
    timeout: 60000
- runFlow: open-workout-tab.yaml
# The session may be on an earlier day than today: walk back to it.
- repeat:
    times: 7
    while:
      notVisible: "Continue workout"
    commands:
      - swipe:
          start: "15%, 70%"
          end: "85%, 70%"
          duration: 350
      - extendedWaitUntil:
          notVisible: "Loading workouts…"
          timeout: 20000
# Z12-45 (W-18): reopened mid-workout, the tab asks "Pick up where you left off?".
# Resume, then minimise (W-14), so the card behind is what this flow checks.
- extendedWaitUntil:
    visible: "Pick up where you left off\\?"
    timeout: 30000
- tapOn: "Resume workout"
- extendedWaitUntil:
    visible: "Minimise workout"
    timeout: 30000
- tapOn: "Minimise workout"
- extendedWaitUntil:
    visible: "Continue workout"
    timeout: 30000
- assertVisible: "(In progress|Paused) · [0-9:]+"
# The set count comes from the full execution, read after the card paints.
- extendedWaitUntil:
    visible: "[0-9]+ of [0-9]+ sets"
    timeout: 20000
- takeScreenshot: W-01b-workout-tab-in-progress
- runFlow: ../../common/assert-no-crash.yaml

# ---- Finish it ----------------------------------------------------------------------
- tapOn: "Continue workout"
- extendedWaitUntil:
    visible: "Log set [0-9]+ ·.*|Finish workout"
    timeout: 30000
- repeat:
    times: 30
    commands:
      - runFlow:
          when:
            visible: "Log set [0-9]+ ·.*"
          commands:
            - tapOn: "Log set [0-9]+ ·.*"
            - waitForAnimationToEnd:
                timeout: 500
- assertNotVisible: "Log set [0-9]+ ·.*"
- tapOn: "Finish workout"
- runFlow:
    when:
      visible: "How hard was the session\\?"
    commands:
      - tapOn: "RPE 7.*"
      - tapOn: "Finish workout"
- extendedWaitUntil:
    visible: "Workout done"
    timeout: 30000
- takeScreenshot: W-17a-summary
- tapOn: "Save and share with .*"
- extendedWaitUntil:
    visible: "This week"
    timeout: 10000
- assertVisible: "[0-9]+ of [0-9]+ done"
- takeScreenshot: W-17b-summary-shared
- runFlow: ../../common/assert-no-crash.yaml
- tapOn: "Done"
- extendedWaitUntil:
    visible: "View summary"
    timeout: 30000
- assertNotVisible: "Start workout"
- assertNotVisible: "Continue workout"
# Not a W-01c shot: the light pass finishes a past day; Aarav's flow has W-01c.
- takeScreenshot: z12-44-finished-day

# ---- Dark, training day: today is done on Workout and on Today --------------------
- runFlow:
    when:
      true: ${DEVICE_THEME == 'dark' && output.trainingDay == 'yes'}
    commands:
      - assertVisible: "${output.today}, Done"
      - tapOn: "Today"
      - extendedWaitUntil:
          notVisible: ".*Loading your day.*"
          timeout: 30000
      - scrollUntilVisible:
          element: "View summary"
          timeout: 20000
      - assertNotVisible: "Start workout"
      - assertNotVisible: "Continue workout"
      - takeScreenshot: z12-44-today-done-card
      - runFlow: open-workout-tab.yaml

# ---- Kill and relaunch: still View summary only ------------------------------------
- launchApp:
    clearState: false
# A cold relaunch shows the startup spinner first: wait for the tab bar.
- extendedWaitUntil:
    visible: "Diet"
    timeout: 120000
- extendedWaitUntil:
    notVisible: ".*Loading your day.*"
    timeout: 60000
- runFlow: open-workout-tab.yaml
- repeat:
    times: 7
    while:
      notVisible: "View summary"
    commands:
      - swipe:
          start: "15%, 70%"
          end: "85%, 70%"
          duration: 350
      - extendedWaitUntil:
          notVisible: "Loading workouts…"
          timeout: 20000
- assertVisible: "View summary"
- assertNotVisible: "Start workout"
- assertNotVisible: "Continue workout"
- runFlow:
    when:
      true: ${DEVICE_THEME == 'dark' && output.trainingDay == 'yes'}
    commands:
      - assertVisible: "${output.today}, Done"
- runFlow: ../../common/assert-no-crash.yaml
