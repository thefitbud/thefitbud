appId: com.thefitbud.mobile.staging
name: Z12-44 Finish a workout (in progress, relaunch, summary, View summary only)
tags:
  - device
  - trainee
  - z12-44
---
# Z12-44: finish a workout on the device. Rohan Mehta (slipping, local demo seed):
# today not started (W-01a), this week's missed workouts in the banner (TR-10c).
# The flow opens a session, logs a set, kills and relaunches the app: the Workout
# tab shows it in progress with its clock and set count from the server (W-01b;
# the duration survives the relaunch). It then finishes it: summary (W-17a),
# shared (W-17b, week ticks equal to "N of M done"), and the day offers View
# summary only, also after another relaunch (ISSUE-MAP #4, #10). The session part
# is finish-session.yaml.
#
# What Rohan has open depends on the weekday (IST) and on what the earlier flows and
# the other theme already used (z12-36/3 first, light before dark), so ist-days.js
# works it out: which workout this pass opens (fwKind/fwLabel), whether today is
# still to do (W-01a), whether the missed banner shows (TR-10c). Every one is
# ASSERTED against the screen, never branched on silently: a seed made for another
# IST day fails here. When no workout is left (Mon dark after light took both, Sun
# dark, ...) the finish steps are skipped, and ist-days.js logs "SKIP ..." (maestro.log).
# Tuesday and Thursday leave three open workouts: both themes get W-01a, TR-10c is
# in light, and both finish a session.
# Screens: W-01a, TR-10c, W-01b, W-17a, W-17b.
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- runFlow:
    file: ../../common/sign-in-password.yaml
    env:
      SIGN_IN_EMAIL: ${QA_SLIPPING_EMAIL}
- extendedWaitUntil:
    notVisible: ".*Loading your day.*"
    timeout: 30000
- runFlow: ist-days.yaml
- runFlow: open-workout-tab.yaml
# MANDATORY: the seed's day and the device's agree, and today's state is what the
# earlier passes left ("Thu 19 Nov, To do" / "Done" / "Rest").
- assertVisible: "${output.today}, ${output.rohanToday}"

# ---- W-01a: today, not started ------------------------------------------------------
- runFlow:
    when:
      true: ${output.fwW01a == 'yes'}
    commands:
      - assertVisible: "Start workout"
      - assertNotVisible: "Continue workout"
      - assertNotVisible: "View summary"
      - takeScreenshot: W-01a-workout-tab-not-started
# Today is done (an earlier pass finished it): View summary only (ISSUE-MAP #4).
- runFlow:
    when:
      true: ${output.rohanToday == 'Done'}
    commands:
      - assertVisible: "View summary"
      - assertNotVisible: "Start workout"
- runFlow:
    when:
      true: ${output.rohanToday == 'Rest'}
    commands:
      - assertNotVisible: "Start workout"
      - assertNotVisible: "Continue workout"

# ---- TR-10c: the missed banner when the slipping open-set still has a miss ---------
# fwBanner=yes → assert the banner (TR-10c shot). fwBanner=no → do NOT blanket
# assertNotVisible every "You missed …": Rohan's overlay can leave an older
# this-week miss open after light finished the newest (Fri rest day still shows
# "You missed Lower body A on Tue" before 07:00 IST). That is correct product
# behaviour. When the prior theme cleared a specific weekday, assert that line
# is gone (output.fwClearedMiss).
- runFlow:
    when:
      true: ${output.fwBanner == 'yes'}
    commands:
      - assertVisible: "You missed .*"
      - takeScreenshot: TR-10c-workout-missed-banner
- runFlow:
    when:
      true: ${output.fwBanner == 'no' && output.fwClearedMiss != ''}
    commands:
      - assertNotVisible: "You missed .* on ${output.fwClearedMiss}.*"
- runFlow: ../../common/assert-no-crash.yaml

# ---- Open, relaunch, finish ----------------------------------------------------------
- runFlow:
    when:
      true: ${output.fwKind != 'none'}
    file: finish-session.yaml
# Nothing left to open for this pass: said, not silent (the reason is in ist-days.js's log).
- runFlow:
    when:
      true: ${output.fwKind == 'none'}
    commands:
      - assertNotVisible: "Continue workout"
