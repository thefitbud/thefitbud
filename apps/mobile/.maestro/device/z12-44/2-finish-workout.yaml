appId: com.thefitbud.mobile.staging
name: Z12-44 Finish a workout (in progress, relaunch, summary, View summary only)
tags:
  - device
  - trainee
  - z12-44
---
# Z12-44: finish a workout on the device. Rohan Mehta (slipping, local demo seed):
# today not started (W-01a) with Monday's missed banner (TR-10c). The flow opens a
# session (open-session.yaml), logs a set, kills and relaunches the app: the Workout
# tab shows it in progress with its clock and set count from the server (W-01b; the
# duration survives the relaunch). It then finishes it: summary (W-17a), shared
# (W-17b, week ticks equal to "N of M done"), and the day offers View summary only,
# on Workout and on Today, also after another relaunch (ISSUE-MAP #4, #10).
#
# Each theme uses one session: light finishes today's, dark a missed one (or the one
# the z12-36 workout flow left open). Screens: W-01a, TR-10c, W-01b, W-17a, W-17b,
# W-01c.
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- runFlow:
    file: ../../common/sign-in-password.yaml
    env:
      SIGN_IN_EMAIL: ${QA_SLIPPING_EMAIL}
- extendedWaitUntil:
    notVisible: ".*Loading your day.*"
    timeout: 30000
- runFlow: open-workout-tab.yaml
- runFlow:
    when:
      visible: "You missed .*"
    commands:
      - takeScreenshot: TR-10c-workout-missed-banner
- runFlow:
    when:
      visible: "Start workout"
    commands:
      - takeScreenshot: W-01a-workout-tab-not-started
- runFlow: ../../common/assert-no-crash.yaml

# ---- Open a session, log a set, kill and relaunch --------------------------------
- runFlow: open-session.yaml
- tapOn: "Log set [0-9]+ ·.*"
- runFlow:
    when:
      visible: "REST"
    commands:
      - tapOn: "Skip rest"
- launchApp:
    clearState: false
- extendedWaitUntil:
    notVisible: ".*Loading your day.*"
    timeout: 60000
- runFlow: open-workout-tab.yaml
# The session may be on an earlier day than today: walk back to it.
- repeat:
    times: 7
    while:
      notVisible: "Continue workout"
    commands:
      - swipe:
          start: "15%, 70%"
          end: "85%, 70%"
          duration: 350
      - extendedWaitUntil:
          notVisible: "Loading workouts…"
          timeout: 20000
- assertVisible: "(In progress|Paused) · [0-9:]+"
# The set count comes from the full execution, read after the card paints.
- extendedWaitUntil:
    visible: "[0-9]+ of [0-9]+ sets"
    timeout: 20000
- takeScreenshot: W-01b-workout-tab-in-progress
- runFlow: ../../common/assert-no-crash.yaml

# ---- Finish it ----------------------------------------------------------------------
- tapOn: "Continue workout"
- extendedWaitUntil:
    visible: "Log set [0-9]+ ·.*|Finish workout"
    timeout: 30000
- repeat:
    times: 30
    commands:
      - runFlow:
          when:
            visible: "Log set [0-9]+ ·.*"
          commands:
            - tapOn: "Log set [0-9]+ ·.*"
            - waitForAnimationToEnd:
                timeout: 500
- assertNotVisible: "Log set [0-9]+ ·.*"
- tapOn: "Finish workout"
- runFlow:
    when:
      visible: "How hard was the session\\?"
    commands:
      - tapOn: "RPE 7.*"
      - tapOn: "Finish workout"
- extendedWaitUntil:
    visible: "Workout done"
    timeout: 30000
- takeScreenshot: W-17a-summary
- tapOn: "Save and share with .*"
- extendedWaitUntil:
    visible: "This week"
    timeout: 10000
- assertVisible: "[0-9]+ of [0-9]+ done"
- takeScreenshot: W-17b-summary-shared
- runFlow: ../../common/assert-no-crash.yaml
- tapOn: "Done"
- extendedWaitUntil:
    visible: "View summary"
    timeout: 30000
- assertNotVisible: "Start workout"
- assertNotVisible: "Continue workout"
- takeScreenshot: W-01c-workout-tab-done

# ---- Kill and relaunch: still View summary only ------------------------------------
- launchApp:
    clearState: false
- extendedWaitUntil:
    notVisible: ".*Loading your day.*"
    timeout: 60000
- runFlow: open-workout-tab.yaml
- repeat:
    times: 7
    while:
      notVisible: "View summary"
    commands:
      - swipe:
          start: "15%, 70%"
          end: "85%, 70%"
          duration: 350
      - extendedWaitUntil:
          notVisible: "Loading workouts…"
          timeout: 20000
- assertVisible: "View summary"
- assertNotVisible: "Start workout"
- assertNotVisible: "Continue workout"
- runFlow: ../../common/assert-no-crash.yaml
