appId: com.thefitbud.mobile.staging
---
# Subflow (no tags) of 2-finish-workout.yaml: opens the workout ist-days.js chose
# (output.fwKind / output.fwLabel), logs a set, relaunches, finishes it, and checks
# that the day offers View summary only. Starts on the Workout tab, today focused.

# ---- Open a session ---------------------------------------------------------------
# Wait for the CTA to settle before tapping: the missed banner can shift layout
# and an early tap leaves the pre-start card on screen (FitBud #485 iOS light).
# Open waits 60 s: iOS light banner Log it can sit busy through a slow
# workout.start + sync/push (~17–23 s in run 44484383185) before ActiveWorkout.
- runFlow:
    when:
      true: ${output.fwKind == 'today'}
    commands:
      - extendedWaitUntil:
          visible: "Start workout"
          timeout: 30000
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          text: "Start workout"
          waitToSettleTimeoutMs: 2000
      - extendedWaitUntil:
          visible: "Log set [0-9]+ ·.*"
          timeout: 60000
- runFlow:
    when:
      true: ${output.fwKind == 'banner'}
    commands:
      - extendedWaitUntil:
          visible: "Log it"
          timeout: 30000
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          text: "Log it"
          waitToSettleTimeoutMs: 2000
      - extendedWaitUntil:
          visible: "Log set [0-9]+ ·.*"
          timeout: 60000
- runFlow:
    when:
      true: ${output.fwKind == 'day'}
    commands:
      # Same order as z12-36/3: pick-up (W-18) can cover the CTA when the day
      # already has an open session from z12-36/3. Handle Resume before scroll.
      - waitForAnimationToEnd:
          timeout: 2000
      - runFlow:
          when:
            visible: "Pick up where you left off\\?"
          commands:
            - tapOn: "Resume workout"
            - extendedWaitUntil:
                visible: "Log set [0-9]+ ·.*"
                timeout: 60000
      - runFlow:
          when:
            notVisible: "Log set [0-9]+ ·.*"
          commands:
            - runFlow:
                file: select-day.yaml
                env:
                  LABEL: ${output.fwLabel}
            - waitForAnimationToEnd:
                timeout: 2000
            - runFlow:
                when:
                  visible: "Pick up where you left off\\?"
                commands:
                  - tapOn: "Resume workout"
                  - extendedWaitUntil:
                      visible: "Log set [0-9]+ ·.*"
                      timeout: 60000
            - runFlow:
                when:
                  notVisible: "Log set [0-9]+ ·.*"
                commands:
                  - extendedWaitUntil:
                      visible: "Log workout|Continue workout"
                      timeout: 30000
                  # Past-day cards put the CTA below the exercise list (same as
                  # z12-36/3); centre it so the tab bar cannot take the tap.
                  - scrollUntilVisible:
                      element:
                        id: "workout-day-cta"
                      direction: DOWN
                      centerElement: true
                      visibilityPercentage: 100
                      timeout: 60000
                  - tapOn:
                      id: "workout-day-cta"
                      waitToSettleTimeoutMs: 2000
                  - extendedWaitUntil:
                      visible: "Log set [0-9]+ ·.*"
                      timeout: 60000
- tapOn: "Log set [0-9]+ ·.*"
- runFlow:
    when:
      visible: "Skip rest"
    commands:
      - tapOn: "Skip rest"
- launchApp:
    clearState: false
# A cold relaunch shows the startup spinner first: wait for the tab bar.
- extendedWaitUntil:
    visible: "Diet"
    timeout: 120000
- extendedWaitUntil:
    notVisible: ".*Loading your day.*"
    timeout: 60000
- runFlow: open-workout-tab.yaml
# Back on the session's own day (the relaunch lands on today). Handle pick-up
# before or after select-day — never scroll to the CTA under the modal.
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      visible: "Pick up where you left off\\?"
    commands:
      - tapOn: "Resume workout"
      - extendedWaitUntil:
          visible: "Minimise workout"
          timeout: 30000
- runFlow:
    when:
      true: ${output.fwKind != 'today'}
      notVisible: "Minimise workout"
    commands:
      - runFlow:
          file: select-day.yaml
          env:
            LABEL: ${output.fwLabel}
      - waitForAnimationToEnd:
          timeout: 2000
# Z12-45 (W-18): reopened mid-workout, the tab asks "Pick up where you left off?".
# Resume, then minimise (W-14), so the card behind is what this flow checks.
- runFlow:
    when:
      notVisible: "Minimise workout"
    commands:
      - extendedWaitUntil:
          visible: "Pick up where you left off\\?"
          timeout: 30000
      - tapOn: "Resume workout"
- extendedWaitUntil:
    visible: "Minimise workout"
    timeout: 30000
- tapOn: "Minimise workout"
- extendedWaitUntil:
    visible: "Continue workout"
    timeout: 30000
- assertVisible: "(In progress|Paused) · [0-9:]+"
# The set count comes from the full execution, read after the card paints.
- extendedWaitUntil:
    visible: "[0-9]+ of [0-9]+ sets"
    timeout: 20000
- takeScreenshot: W-01b-workout-tab-in-progress
- runFlow: ../../common/assert-no-crash.yaml

# ---- Finish it ----------------------------------------------------------------------
- scrollUntilVisible:
    element:
      id: "workout-day-cta"
    direction: DOWN
    centerElement: true
    visibilityPercentage: 100
    timeout: 60000
- tapOn:
    id: "workout-day-cta"
- extendedWaitUntil:
    visible: "Log set [0-9]+ ·.*|Finish workout"
    timeout: 30000
- repeat:
    times: 30
    commands:
      - runFlow:
          when:
            visible: "Log set [0-9]+ ·.*"
          commands:
            - tapOn: "Log set [0-9]+ ·.*"
            - waitForAnimationToEnd:
                timeout: 500
- assertNotVisible: "Log set [0-9]+ ·.*"
- tapOn: "Finish workout"
- runFlow:
    when:
      visible: "How hard was the session\\?"
    commands:
      - tapOn: "RPE 7.*"
      - tapOn: "Finish workout"
- extendedWaitUntil:
    visible: "Workout done"
    timeout: 30000
- takeScreenshot: W-17a-summary
- tapOn: "Save and share with .*"
- extendedWaitUntil:
    visible: "This week"
    timeout: 10000
- assertVisible: "[0-9]+ of [0-9]+ done"
- takeScreenshot: W-17b-summary-shared
- runFlow: ../../common/assert-no-crash.yaml
- tapOn: "Done"
- extendedWaitUntil:
    visible: "View summary"
    timeout: 60000
- assertNotVisible: "Start workout"
- assertNotVisible: "Continue workout"
# Not a W-01c shot: it is a day the pass chose (often a past one); Aarav's flow has W-01c.
- takeScreenshot: z12-44-finished-day

# ---- Today's workout was the one finished: done on Workout and on Today -------------
- runFlow:
    when:
      true: ${output.fwKind == 'today'}
    commands:
      - assertVisible: "${output.today}, Done"
      - tapOn: "Today"
      - extendedWaitUntil:
          notVisible: ".*Loading your day.*"
          timeout: 30000
      - runFlow:
          when:
            visible: ".*reviewed your check-in.*"
          commands:
            - extendedWaitUntil:
                notVisible: ".*reviewed your check-in.*"
                timeout: 15000
      # Wait for the done CTA before scrolling (FitBud #485 iOS dark).
      - extendedWaitUntil:
          visible: "View summary"
          timeout: 60000
      - scrollUntilVisible:
          element: "View summary"
          timeout: 30000
      - assertNotVisible: "Start workout"
      - assertNotVisible: "Continue workout"
      - takeScreenshot: z12-44-today-done-card
      - runFlow: open-workout-tab.yaml

# ---- Kill and relaunch: still View summary only ------------------------------------
- launchApp:
    clearState: false
# A cold relaunch shows the startup spinner first: wait for the tab bar.
- extendedWaitUntil:
    visible: "Diet"
    timeout: 120000
- extendedWaitUntil:
    notVisible: ".*Loading your day.*"
    timeout: 60000
- runFlow: open-workout-tab.yaml
- runFlow:
    when:
      true: ${output.fwKind != 'today'}
    commands:
      - runFlow:
          file: select-day.yaml
          env:
            LABEL: ${output.fwLabel}
- extendedWaitUntil:
    visible: "View summary"
    timeout: 60000
- assertNotVisible: "Start workout"
- assertNotVisible: "Continue workout"
- runFlow:
    when:
      true: ${output.fwKind == 'today'}
    commands:
      - assertVisible: "${output.today}, Done"
- runFlow: ../../common/assert-no-crash.yaml
