appId: com.thefitbud.mobile.staging
---
# Subflow (no tags). From Today (or Diet/Progress), opens the Workout tab and
# waits for its week. Tap the tab bar by testID — never the Today tile labelled
# "Workout", which Maestro can hit first and leave the shell on the wrong tab
# (iOS dark W-03 on Diet, 44517473406). Fail loudly if Workout did not open.
- tapOn:
    id: "tab-workout"
- assertVisible:
    id: "workout-tab-root"
- assertNotVisible:
    id: "diet-summary"
- extendedWaitUntil:
    notVisible: "Loading workouts…"
    timeout: 30000
