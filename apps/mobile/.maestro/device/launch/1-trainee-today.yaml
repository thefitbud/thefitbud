appId: com.thefitbud.mobile.staging
name: Launch smoke, trainee Today loads
tags:
  - device
  - launch
  - trainee
---
# Launch smoke test (Z12-35, Firoz 15 Nov 2026): the app opens, sign-in works, Today loads.
# Run on every scoped task run: dispatch flows=launch,<task tag>.
# Env from the harness: QA_ONTRACK_EMAIL, QA_PASSWORD (the public local demo password).
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
# Sign-in sheet, then the signed-in home (the common flow waits for both).
- runFlow:
    file: ../../common/sign-in-password.yaml
    env:
      SIGN_IN_EMAIL: ${QA_ONTRACK_EMAIL}
# Banner drain + above-the-fold home (FitBud #485). Prefer today-summary
# testID (date-independent). Rest day / Recovery / Today's workout cover
# Android rest days where the srOnly heading is missing from the a11y tree.
- runFlow: ../../common/wait-trainee-today-ready.yaml
- scrollUntilVisible:
    element:
      id: "today-summary"
    timeout: 30000
- assertVisible: "Today"
- assertVisible: "Today's workout.*|Rest day|Recovery is part of the plan|View summary"
# The heading also shows when the day's data failed to load (TodayTab's catch shows a
# "Couldn't refresh" banner), so assert that banner is absent.
- assertNotVisible: ".*Couldn't refresh.*"
- takeScreenshot: launch-trainee-today
- runFlow: ../../common/assert-no-crash.yaml
