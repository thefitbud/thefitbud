appId: com.thefitbud.mobile.staging
name: Z12-38 trainee in-app banner (TR-06h) leaves by itself, swipes away, opens on a tap
tags:
  - device
  - trainee
  - z12-38
env:
  BANNER: "Rahul left a note.*"
  NOTE: "Try 42.5 kg on the RDLs today if set 2 feels easy."
---
# Aarav Shah (on track, local demo seed; his coach is Rahul Verma). While Aarav is on
# Progress, the coach shares a note through the local API (share-note.js); going back
# to Today reads it, and the trainee foreground banner queues it on the shared notice
# queue (Z12-38). A new note is a new banner (each is shown once per session).
#
# Why not at a cold launch: on the Android emulator, launchApp's settle wait plus slow
# hierarchy dumps can outlast a 4 s banner (run 43715594740, Android light).
#
# What this proves on the device: the banner shows over Today below the status bar,
# leaves by itself (about 4 s), a swipe up removes it, and a tap removes it
# and lands on Today. A push received in the foreground goes through the same queue
# (unit-tested through the receive handler, foregroundPush.test.ts); the gate cannot
# send a push in the middle of a flow, so that path is on the Z12-58 checklist.
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
# iOS: an earlier flow's deep link (z12-36's gallery link) can leave the system
# "Open in …?" alert over the app (run 43741069030). Dismiss it if it is there.
- runFlow:
    when:
      visible: "Open in .*FitBud Staging.*"
    commands:
      - tapOn: "Cancel"
- runFlow:
    file: ../../common/sign-in-password.yaml
    env:
      SIGN_IN_EMAIL: ${QA_ONTRACK_EMAIL}
# Banners from an earlier run's unread notes may show and leave meanwhile.
# Wait until the queue is clear before seeding a new note (iOS light run
# 44402757234: "Rahul left a note" not visible — raced a leftover banner).
- extendedWaitUntil:
    notVisible: "${BANNER}"
    timeout: 20000
- extendedWaitUntil:
    notVisible: ".*left a note.*"
    timeout: 10000

# 1. It shows (a due-meal banner may come first: one at a time), then leaves by itself.
- tapOn: "Progress"
- extendedWaitUntil:
    notVisible: "${BANNER}"
    timeout: 10000
- runScript:
    file: share-note.js
    env:
      API: http://127.0.0.1:8787
      TRAINER_EMAIL: ${QA_TRAINER_EMAIL}
      TRAINEE_EMAIL: ${QA_ONTRACK_EMAIL}
      PASSWORD: ${QA_PASSWORD}
      NOTE: ${NOTE}
# Do not wait for the screen to settle after the tap: on a cold Android emulator the
# settle wait plus slow hierarchy dumps can outlast a 4 s banner (runs 43715594740 and
# 43741069030, Android light). Start looking for the banner straight away, and allow
# for a slow first read on a cold local API (run 43744259140, iOS light).
- tapOn:
    text: "Today"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "${BANNER}"
    timeout: 45000
- takeScreenshot: TR-06h
- extendedWaitUntil:
    notVisible: "${BANNER}"
    timeout: 12000
- runFlow: ../../common/assert-no-crash.yaml

# 2. Swipe up removes it. Wait for any auto-leave to finish first.
- tapOn: "Progress"
- extendedWaitUntil:
    notVisible: "${BANNER}"
    timeout: 10000
- runScript:
    file: share-note.js
    env:
      API: http://127.0.0.1:8787
      TRAINER_EMAIL: ${QA_TRAINER_EMAIL}
      TRAINEE_EMAIL: ${QA_ONTRACK_EMAIL}
      PASSWORD: ${QA_PASSWORD}
      NOTE: "Keep the last set slow on the way down."
- tapOn:
    text: "Today"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "${BANNER}"
    timeout: 45000
- swipe:
    from: "${BANNER}"
    direction: UP
    duration: 300
# Evidence of the gesture: the frame right after the swipe. The 4 s timer would
# remove the banner anyway, so the timing itself (gone at once, not after 4 s) is
# proved by NoticeHost.render.test.tsx and on Firoz's phone checklist (Z12-58): a
# simulator's slow accessibility snapshots cannot time it reliably (runs 43744259140,
# 44063388981).
- takeScreenshot: z12-38-after-swipe
- extendedWaitUntil:
    notVisible: "${BANNER}"
    timeout: 12000

# 3. A tap removes it and lands on Today (a coach note opens Today); it marks it read.
- tapOn: "Progress"
- extendedWaitUntil:
    notVisible: "${BANNER}"
    timeout: 10000
- runScript:
    file: share-note.js
    env:
      API: http://127.0.0.1:8787
      TRAINER_EMAIL: ${QA_TRAINER_EMAIL}
      TRAINEE_EMAIL: ${QA_ONTRACK_EMAIL}
      PASSWORD: ${QA_PASSWORD}
      NOTE: "Water first thing tomorrow."
- tapOn:
    text: "Today"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "${BANNER}"
    timeout: 45000
- tapOn: "${BANNER}"
- extendedWaitUntil:
    notVisible: "${BANNER}"
    timeout: 12000
- assertVisible: "Today's workout.*|Rest day|Recovery is part of the plan|This week"
- runFlow: ../../common/assert-no-crash.yaml
