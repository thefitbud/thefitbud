appId: com.thefitbud.mobile.staging
name: Z12-46 No-plan trainee, Today and Progress (calm states, no server text)
tags:
  - device
  - trainee
  - z12-46
---
# Z12-46: Harpreet (`harpreet.ready`, local demo seed): an active relationship with no
# plan. Today says the coach is preparing the plan (TR-10b's pattern, recorded in the
# PR) and the check-in card says the first check-in follows the plan, never a server
# message; Progress shows its empty state (TR-13b).
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
# common/sign-in-password.yaml ends by waiting for "Today's workout", a heading a
# trainee with no plan never gets (CU22): wait for the tab bar instead.
- extendedWaitUntil:
    visible: "Sign in with a code instead"
    timeout: 60000
- tapOn: "you@example.com or 9876543210"
- inputText: harpreet.ready@demo.fitbud.test
- tapOn: "Your password"
- inputText: ${QA_PASSWORD}
- tapOn: "Your coach's plan for today is waiting\\."
- tapOn:
    text: "Sign in"
    below: "Forgot password\\??"
- extendedWaitUntil:
    visible: "Diet"
    timeout: 60000
- extendedWaitUntil:
    notVisible: ".*Loading your day.*"
    timeout: 30000
- extendedWaitUntil:
    visible: "Your coach is preparing your plan"
    timeout: 30000
- assertNotVisible: "Couldn't load your plan"
- assertNotVisible: ".*CHK-.*"
- takeScreenshot: Today-no-plan
- runFlow: ../../common/assert-no-crash.yaml
- tapOn: "Progress"
- extendedWaitUntil:
    visible: "Progress"
    timeout: 20000
- takeScreenshot: TR-13b-progress-empty
- runFlow: ../../common/assert-no-crash.yaml
