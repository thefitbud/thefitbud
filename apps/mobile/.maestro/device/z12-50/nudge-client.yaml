appId: com.thefitbud.mobile.staging
---
# Subflow of flows/v3/F20-triage-nudge.yaml (Z12-50). No tags: it is only ever called.
# Input: CLIENT_SLUG (client-row-* testID slug). Opens the client and presses Remind… (id client-nudge).
# v3 client detail has Needs attention + Review (not Mark reviewed/Resolve on this screen).
- launchApp:
    stopApp: true
    permissions:
      all: allow
- runFlow: ../../common/wait-attention-loaded.yaml
- tapOn:
    id: "tab-clients"
- scrollUntilVisible:
    element:
      id: "client-row-${CLIENT_SLUG}"
    timeout: 60000
- tapOn:
    id: "client-row-${CLIENT_SLUG}"
# Prefer client status; a row tap can open exception review instead.
- extendedWaitUntil:
    visible:
      id: "client-nudge"
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible:
        id: "exception-review"
    commands:
      # The review panel (Z14-23 removed its more menu): its client link opens the client page.
      - tapOn:
          id: "client-name-link"
- extendedWaitUntil:
    visible:
      id: "client-nudge"
    timeout: 30000
- runFlow: to-nudge.yaml
