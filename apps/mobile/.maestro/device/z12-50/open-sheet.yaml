appId: com.thefitbud.mobile.staging
---
# Subflow of F20 (Z12-50). Through TM-03j picker when present, then the nudge sheet.
# Prefer nudge-preview id — PREVIEW label case can differ by platform a11y.
- runFlow:
    when:
      visible: ".*Nudge .* about.*"
    commands:
      - takeScreenshot: TM-03j
      - tapOn:
          id: "nudge-pick-next"
- extendedWaitUntil:
    visible:
      id: "nudge-preview"
    timeout: 20000
